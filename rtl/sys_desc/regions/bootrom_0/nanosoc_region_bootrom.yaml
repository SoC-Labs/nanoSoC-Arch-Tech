# Derived from RTL: nanosoc_arch_tech/rtl/src/regions/bootrom_0/nanosoc_region_bootrom_0.v

module:
  name: nanosoc_region_bootrom_0
  gen: False
  desc: >
    Boot ROM region. Read-only memory containing boot code. Has no reset port
    (HCLK only). Instantiates nanosoc_bootrom_cpu_0 internally. Address bits
    [BOOTROM_ADDR_W-1:0] are extracted from HADDR for memory access.

  params:
    SYS_ADDR_W:    { type: int, default: 32, desc: "System address width" }
    SYS_DATA_W:    { type: int, default: 32, desc: "System data width" }
    BOOTROM_ADDR_W: { type: int, default: 11, desc: "Boot ROM address width (phys = 4 * 2^N bytes, default 8 KB)" }

  interfaces:
    # Clock (no reset — ROM content is fixed)
    - { name: HCLK, type: wire, direction: in, params: { WIDTH: 1 }, desc: AHB clock }

    # AHB slave port
    - { name: ahb_slave, type: ahb, direction: target, params: { ADDR_WIDTH: $SYS_ADDR_W, DATA_WIDTH: $SYS_DATA_W }, desc: AHB slave port for boot ROM access }
