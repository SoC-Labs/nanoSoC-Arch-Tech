# Derived from RTL: nanosoc_arch_tech/rtl/src/regions/dmem_0/nanosoc_region_dmem_0.v

module:
  name: nanosoc_region_dmem_0
  gen: False
  desc: >
    Data memory region. Instantiates sl_ahb_sram internally.
    Address bits [DMEM_RAM_ADDR_W-1:0] are extracted from HADDR.

  params:
    SYS_ADDR_W:      { type: int, default: 32, desc: "System address width" }
    SYS_DATA_W:      { type: int, default: 32, desc: "System data width" }
    DMEM_RAM_ADDR_W: { type: int, default: 14, desc: "DMEM address width (phys = 4 * 2^N bytes, default 64 KB)" }
    DMEM_RAM_DATA_W: { type: int, default: 32, desc: "DMEM data width" }

  interfaces:
    # Clock and Reset
    - { name: HCLK,    type: wire, direction: in, params: { WIDTH: 1 }, desc: AHB clock }
    - { name: HRESETn, type: wire, direction: in, params: { WIDTH: 1 }, desc: AHB reset (active low) }

    # AHB slave port
    - { name: ahb_slave, type: ahb, direction: target, params: { ADDR_WIDTH: $SYS_ADDR_W, DATA_WIDTH: $SYS_DATA_W }, desc: AHB slave port for data memory access }
