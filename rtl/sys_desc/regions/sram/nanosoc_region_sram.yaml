# Derived from RTL: nanosoc_arch_tech/rtl/src/regions/sram/nanosoc_region_sram.v
# Template module — instantiated as sram_0 and sram_1 in nanosoc.sv

module:
  name: nanosoc_region_sram
  gen: False
  desc: >
    General-purpose SRAM region with AHB interface. Instantiates sl_ahb_sram
    internally. Used as a template for both sram_0 (0x80000000) and sram_1
    (0x90000000) expansion memory banks.

  params:
    SYS_ADDR_W: { type: int, default: 32, desc: "System address width" }
    SYS_DATA_W: { type: int, default: 32, desc: "System data width" }
    RAM_ADDR_W: { type: int, default: 14, desc: "RAM address width (phys = 4 * 2^N bytes)" }
    RAM_DATA_W: { type: int, default: 32, desc: "RAM data width" }

  interfaces:
    # Clock and Reset
    - { name: HCLK,    type: wire, direction: in, params: { WIDTH: 1 }, desc: AHB clock }
    - { name: HRESETn, type: wire, direction: in, params: { WIDTH: 1 }, desc: AHB reset (active low) }

    # AHB slave port
    - { name: ahb_slave, type: ahb, direction: target, params: { ADDR_WIDTH: $SYS_ADDR_W, DATA_WIDTH: $SYS_DATA_W, EXCLUDE: [hburst, hmastlock] }, desc: AHB slave port for SRAM access }
