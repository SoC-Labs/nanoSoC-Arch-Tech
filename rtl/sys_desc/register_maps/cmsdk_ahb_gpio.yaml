register_map:
  name: cmsdk_ahb_gpio
  gen: false
  module: cmsdk_ahb_gpio
  description: >
    16-bit AHB GPIO with alternate function support, individual pin interrupts
    (edge/level, polarity configurable), and masked byte access. Supports
    configurable alternate function mask and defaults via parameters.
  address_width: 12
  data_width: 32

  identification:
    pid4: 0x04
    pid5: 0x00
    pid6: 0x00
    pid7: 0x00
    pid0: 0x20
    pid1: 0xB8
    pid2: 0x1B
    pid3: 0x00
    cid0: 0x0D
    cid1: 0xF0
    cid2: 0x05
    cid3: 0xB1

  registers:
    - name: DATA
      offset: 0x000
      width: 32
      access: RW
      description: >
        Data register. Read returns sampled pin input (bits [15:0]).
        Write sets output data latch (bits [15:0]).
      fields:
        - name: DATAOUT
          bits: "15:0"
          access: RW
          description: GPIO pin data (input on read, output on write)

    - name: DATAOUT
      offset: 0x004
      width: 32
      access: RW
      description: Data output latch register (same as DATA write, separate read-back)

    - name: OUTENSET
      offset: 0x010
      width: 32
      access: RW
      description: Output enable set (write 1 to enable pin as output; read returns current state)

    - name: OUTENCLR
      offset: 0x014
      width: 32
      access: WO
      description: Output enable clear (write 1 to set pin as input)

    - name: ALTFUNCSET
      offset: 0x018
      width: 32
      access: RW
      description: Alternate function set (write 1 to enable alternate function on pin)

    - name: ALTFUNCCLR
      offset: 0x01C
      width: 32
      access: WO
      description: Alternate function clear (write 1 to select GPIO function)

    - name: INTENSET
      offset: 0x020
      width: 32
      access: RW
      description: Interrupt enable set (write 1 to enable interrupt on pin)

    - name: INTENCLR
      offset: 0x024
      width: 32
      access: WO
      description: Interrupt enable clear (write 1 to disable interrupt on pin)

    - name: INTTYPESET
      offset: 0x028
      width: 32
      access: RW
      description: "Interrupt type set (write 1 for edge-triggered; read returns current)"

    - name: INTTYPECLR
      offset: 0x02C
      width: 32
      access: WO
      description: "Interrupt type clear (write 1 for level-sensitive)"

    - name: INTPOLSET
      offset: 0x030
      width: 32
      access: RW
      description: "Interrupt polarity set (write 1 for high/rising edge; read returns current)"

    - name: INTPOLCLR
      offset: 0x034
      width: 32
      access: WO
      description: "Interrupt polarity clear (write 1 for low/falling edge)"

    - name: INTSTATUS
      offset: 0x038
      width: 32
      access: W1C
      description: Interrupt status / clear (read shows status, write 1 clears)

    - name: MASKLOWBYTE
      offset: 0x400
      width: 32
      access: RW
      description: >
        Masked access for lower byte. Address bits [9:2] form the byte mask.
        Only pins where the corresponding mask bit is 1 are read/written.
        Covers offsets 0x400-0x7FC.

    - name: MASKHIGHBYTE
      offset: 0x800
      width: 32
      access: RW
      description: >
        Masked access for upper byte. Address bits [9:2] form the byte mask.
        Only pins where the corresponding mask bit is 1 are read/written.
        Covers offsets 0x800-0xBFC.

    - name: PID4
      offset: 0xFD0
      width: 32
      access: RO
      description: Peripheral ID 4

    - name: PID5
      offset: 0xFD4
      width: 32
      access: RO
      description: Peripheral ID 5

    - name: PID6
      offset: 0xFD8
      width: 32
      access: RO
      description: Peripheral ID 6

    - name: PID7
      offset: 0xFDC
      width: 32
      access: RO
      description: Peripheral ID 7

    - name: PID0
      offset: 0xFE0
      width: 32
      access: RO
      description: Peripheral ID 0

    - name: PID1
      offset: 0xFE4
      width: 32
      access: RO
      description: Peripheral ID 1

    - name: PID2
      offset: 0xFE8
      width: 32
      access: RO
      description: Peripheral ID 2

    - name: PID3
      offset: 0xFEC
      width: 32
      access: RO
      description: Peripheral ID 3

    - name: CID0
      offset: 0xFF0
      width: 32
      access: RO
      description: Component ID 0

    - name: CID1
      offset: 0xFF4
      width: 32
      access: RO
      description: Component ID 1

    - name: CID2
      offset: 0xFF8
      width: 32
      access: RO
      description: Component ID 2

    - name: CID3
      offset: 0xFFC
      width: 32
      access: RO
      description: Component ID 3
