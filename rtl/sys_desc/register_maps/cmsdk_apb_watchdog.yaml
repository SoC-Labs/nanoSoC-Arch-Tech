register_map:
  name: cmsdk_apb_watchdog
  module: cmsdk_apb_watchdog
  description: >
    Watchdog timer. Counts down from load value; generates interrupt on first
    timeout and reset on second timeout if not cleared. Write access to most
    registers requires unlock via WDOGLOCK (write 0x1ACCE551 to unlock).
  address_width: 12
  data_width: 32

  identification:
    pid4: 0x04
    pid5: 0x00
    pid6: 0x00
    pid7: 0x00
    pid0: 0x24
    pid1: 0xB8
    pid2: 0x1B
    pid3: 0x00
    cid0: 0x0D
    cid1: 0xF0
    cid2: 0x05
    cid3: 0xB1

  registers:
    - name: WDOGLOAD
      offset: 0x000
      width: 32
      access: RW
      description: Watchdog load value (restarts counter with this value)

    - name: WDOGVALUE
      offset: 0x004
      width: 32
      access: RO
      description: Current watchdog counter value (read-only)

    - name: WDOGCONTROL
      offset: 0x008
      width: 32
      access: RW
      reset_value: 0x00000000
      description: Watchdog control register
      fields:
        - name: INTEN
          bits: "0"
          access: RW
          description: Interrupt enable (first timeout generates interrupt)
        - name: RESEN
          bits: "1"
          access: RW
          description: Reset enable (second timeout generates reset)

    - name: WDOGINTCLR
      offset: 0x00C
      width: 32
      access: WO
      description: Watchdog interrupt clear (write any value to clear and restart counter)

    - name: WDOGRIS
      offset: 0x010
      width: 32
      access: RO
      description: Watchdog raw interrupt status
      fields:
        - name: RAWINT
          bits: "0"
          access: RO
          description: Raw interrupt status (1 = counter reached zero)

    - name: WDOGMIS
      offset: 0x014
      width: 32
      access: RO
      description: Watchdog masked interrupt status
      fields:
        - name: MASKINT
          bits: "0"
          access: RO
          description: Masked interrupt status (RIS AND INTEN)

    - name: WDOGLOCK
      offset: 0xC00
      width: 32
      access: RW
      description: >
        Lock register. Write 0x1ACCE551 to unlock write access to all other
        registers. Write any other value to lock. Read returns 0 if unlocked,
        1 if locked.

    - name: WDOGITCR
      offset: 0xF00
      width: 32
      access: RW
      description: Integration test control register

    - name: WDOGITOP
      offset: 0xF04
      width: 32
      access: WO
      description: Integration test output set register

    - name: PID4
      offset: 0xFD0
      width: 32
      access: RO
      description: Peripheral ID 4

    - name: PID5
      offset: 0xFD4
      width: 32
      access: RO
      description: Peripheral ID 5

    - name: PID6
      offset: 0xFD8
      width: 32
      access: RO
      description: Peripheral ID 6

    - name: PID7
      offset: 0xFDC
      width: 32
      access: RO
      description: Peripheral ID 7

    - name: PID0
      offset: 0xFE0
      width: 32
      access: RO
      description: Peripheral ID 0

    - name: PID1
      offset: 0xFE4
      width: 32
      access: RO
      description: Peripheral ID 1

    - name: PID2
      offset: 0xFE8
      width: 32
      access: RO
      description: Peripheral ID 2

    - name: PID3
      offset: 0xFEC
      width: 32
      access: RO
      description: Peripheral ID 3

    - name: CID0
      offset: 0xFF0
      width: 32
      access: RO
      description: Component ID 0

    - name: CID1
      offset: 0xFF4
      width: 32
      access: RO
      description: Component ID 1

    - name: CID2
      offset: 0xFF8
      width: 32
      access: RO
      description: Component ID 2

    - name: CID3
      offset: 0xFFC
      width: 32
      access: RO
      description: Component ID 3
