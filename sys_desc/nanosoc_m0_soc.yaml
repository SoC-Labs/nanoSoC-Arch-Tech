# Derived from RTL: nanosoc_arch_tech/rtl/src/nanosoc/nanosoc.sv
#
# Format extensions beyond example_soc.yaml:
#   - clocks/resets: clock and reset domain modeling
#   - assigns: combinational glue logic (with type: interrupt for IRQ routing)
#   - firmware: linker profiles, ADP upload, hex adjustment
#   - phys_size: physical memory size vs address aperture on targets
#   - rtl_module: standalone IP references (no YAML module: file)
#   - condition: conditional instantiation on instances
#   - "signal[high:low]": bit-slice syntax in conn values

module:
  name: nanosoc
  gen: False
  desc: >
    NanoSoC core module. ARM Cortex-M0 based SoC with 4-initiator x 7-target
    AHB bus matrix, APB peripherals (timers, UARTs, watchdog, GPIO), configurable
    DMA (PL230/DMA350), expansion region for custom accelerators, and SoCDebug
    interface via FTDI FT1248. This module is wrapped by nanosoc_system.v which
    adds the expansion region instantiation.

  # =============================================================================
  # Design Parameters (from nanosoc.sv lines 14-77)
  # =============================================================================
  params:
    # System bus
    SYS_ADDR_W:         { type: int, default: 32,           desc: "System address width" }
    SYS_DATA_W:         { type: int, default: 32,           desc: "System data width" }
    APB_ADDR_W:         { type: int, default: 12,           desc: "APB peripheral address width" }
    APB_DATA_W:         { type: int, default: 32,           desc: "APB peripheral data width" }

    # DMA
    DMAC_0_TYPE:        { type: int, default: 0,            desc: "DMAC 0 type: 0=None, 1=PL230, 2=DMA350" }
    DMAC_1_TYPE:        { type: int, default: 0,            desc: "DMAC 1 type: 0=None, 1=PL230" }
    DMAC_0_CHANNEL_NUM: { type: int, default: 4,            desc: "DMAC 0 channel count" }
    DMAC_1_CHANNEL_NUM: { type: int, default: 2,            desc: "DMAC 1 channel count" }

    # Boot ROM
    BOOTROM_ADDR_W:     { type: int, default: 11,           desc: "Boot ROM address width (phys = 4 * 2^N bytes, default 8 KB)" }

    # Instruction Memory
    IMEM_RAM_ADDR_W:    { type: int, default: 14,           desc: "IMEM address width (default 64 KB)" }
    IMEM_RAM_DATA_W:    { type: int, default: 32,           desc: "IMEM data width" }
    IMEM_MEM_FPGA_IMG:  { type: str, default: "image.hex",  desc: "FPGA image to preload into IMEM" }

    # Data Memory
    DMEM_RAM_ADDR_W:    { type: int, default: 14,           desc: "DMEM address width (default 64 KB)" }
    DMEM_RAM_DATA_W:    { type: int, default: 32,           desc: "DMEM data width" }

    # Expansion SRAM
    SRAM_0_RAM_ADDR_W:  { type: int, default: 14,           desc: "SRAM 0 address width (default 64 KB)" }
    SRAM_0_RAM_DATA_W:  { type: int, default: 32,           desc: "SRAM 0 data width" }
    SRAM_1_RAM_ADDR_W:  { type: int, default: 14,           desc: "SRAM 1 address width (default 64 KB)" }
    SRAM_1_RAM_DATA_W:  { type: int, default: 32,           desc: "SRAM 1 data width" }

    # CPU core
    CLKGATE_PRESENT:    { type: int, default: 0,            desc: "Clock gating present" }
    BE:                 { type: int, default: 0,            desc: "Endianness: 0=little, 1=big" }
    BKPT:               { type: int, default: 4,            desc: "Number of breakpoint comparators" }
    DBG:                { type: int, default: 1,            desc: "Debug configuration enable" }
    NUMIRQ:             { type: int, default: 32,           desc: "Number of IRQ lines" }
    SMUL:               { type: int, default: 0,            desc: "Multiplier: 0=small, 1=fast" }
    SYST:               { type: int, default: 1,            desc: "SysTick enable" }
    WIC:                { type: int, default: 1,            desc: "Wake-up interrupt controller" }
    WICLINES:           { type: int, default: 34,           desc: "WIC lines" }
    WPT:                { type: int, default: 2,            desc: "Number of DWT comparators" }
    RESET_ALL_REGS:     { type: int, default: 1,            desc: "Reset all registers" }
    INCLUDE_JTAG:       { type: int, default: 0,            desc: "Include JTAG feature" }

    # SoCDebug / FTDI
    PROMPT_CHAR:        { type: str, default: "]",          desc: "SoCDebug prompt character" }
    FT1248_WIDTH:       { type: int, default: 1,            desc: "FTDI interface width: 1, 2, or 4" }
    FT1248_CLKON:       { type: int, default: 1,            desc: "FTDI clock always on" }
    FT1248_CLKDIV:      { type: int, default: 15,           desc: "FTDI clock divider ratio" }

    # System identification
    SYSTABLE_BASE:      { type: int, default: 0xF0000000,   desc: "System ROM table base address" }
    SOCLABS_JEPID:      { type: int, default: 0x51,         desc: "SoC Labs JEDEC manufacturer ID" }
    NANOSOC_PARTNUMBER: { type: int, default: 0x001,        desc: "NanoSoC part number" }
    NANOSOC_REVISION:   { type: int, default: 0x1,          desc: "NanoSoC revision" }

  # =============================================================================
  # Clock Domains
  # =============================================================================
  clocks:
    - { name: sys_clk,      source: external,                  desc: "System input clock (free-running, from external oscillator)" }
    - { name: sys_fclk,     source: u_ss_systemctrl.SYS_FCLK,  desc: "Free-running clock (passthrough from sys_clk via systemctrl)" }
    - { name: sys_hclk,     source: u_ss_cpu.sys_hclk,         desc: "AHB system clock (generated by CPU subsystem PRMU from sys_fclk)" }
    - { name: sys_pclk,     source: u_ss_systemctrl.SYS_PCLK,  desc: "APB peripheral clock (generated by systemctrl clkctrl from sys_hclk)" }
    - { name: sys_pclkg,    source: u_ss_systemctrl.SYS_PCLKG, desc: "Gated APB clock (for bus interface power saving)" }
    - { name: cpu_0_swclk,  source: external,                  desc: "Serial wire debug clock (from external debug probe)" }

  # =============================================================================
  # Reset Domains
  # =============================================================================
  resets:
    - { name: sys_sysresetn, active: low, source: external,                     desc: "External system reset input" }
    - { name: sys_poresetn,  active: low, source: u_ss_cpu.sys_poresetn,        desc: "Power-on reset (generated by CPU subsystem PRMU)" }
    - { name: sys_hresetn,   active: low, source: u_ss_cpu.sys_hresetn,         desc: "AHB reset (incorporates watchdog, lockup, debug resets)" }
    - { name: sys_presetn,   active: low, source: u_ss_systemctrl.SYS_PRESETn,  desc: "APB peripheral reset (generated by systemctrl)" }

  # =============================================================================
  # Interfaces (from nanosoc.sv port list, lines 79-172)
  # =============================================================================
  interfaces:
    # Clock and Reset
    - { name: sys_clk,         type: wire, direction: in,  params: { WIDTH: 1 }, desc: "System input clock" }
    - { name: sys_sysresetn,   type: wire, direction: in,  params: { WIDTH: 1 }, desc: "System reset (active low)" }
    - { name: sys_xtalclk_out, type: wire, direction: out, params: { WIDTH: 1 }, desc: "Crystal clock output" }

    # Scan/Test
    - { name: sys_scanenable,  type: wire, direction: in,  params: { WIDTH: 1 }, desc: "Scan mode enable" }
    - { name: sys_testmode,    type: wire, direction: in,  params: { WIDTH: 1 }, desc: "Test mode enable" }
    - { name: sys_scaninhclk,  type: wire, direction: in,  params: { WIDTH: 1 }, desc: "HCLK scan input" }
    - { name: sys_scanouthclk, type: wire, direction: out, params: { WIDTH: 1 }, desc: "Scan chain output" }

    # Serial Wire Debug
    - { name: cpu_0_swd, type: swd, direction: receiver, params: {}, desc: "CPU SWD debug interface" }

    # GPIO ports
    - { name: p0, type: gpio, direction: inout, params: { WIDTH: 16 }, desc: "GPIO port 0 (16 pins)" }
    - { name: p1, type: gpio, direction: inout, params: { WIDTH: 16 }, desc: "GPIO port 1 (16 pins, lower 7 muxed with FT1248/EXTIO)" }

    # Generated AHB clock and reset (for expansion subsystem)
    - { name: sys_hclk,    type: wire, direction: out, params: { WIDTH: 1 }, desc: "AHB clock output (for expansion)" }
    - { name: sys_hresetn, type: wire, direction: out, params: { WIDTH: 1 }, desc: "AHB reset output (for expansion)" }

    # Expansion AHB slave port
    - { name: exp, type: ahb, direction: target, params: { ADDR_WIDTH: $SYS_ADDR_W, DATA_WIDTH: $SYS_DATA_W }, desc: "Expansion region AHB slave port (0x60000000-0x7FFFFFFF)" }

    # Expansion AXI-Stream channels
    - { name: exp_str_in_0,  type: axis, direction: out, params: { DATA_WIDTH: $SYS_DATA_W },              desc: "DMA stream 0 to expansion" }
    - { name: exp_str_in_1,  type: axis, direction: out, params: { DATA_WIDTH: $SYS_DATA_W },              desc: "DMA stream 1 to expansion" }
    - { name: exp_str_in_2,  type: axis, direction: out, params: { DATA_WIDTH: $SYS_DATA_W },              desc: "DMA stream 2 to expansion" }
    - { name: exp_str_out_0, type: axis, direction: in,  params: { DATA_WIDTH: $SYS_DATA_W, HAS_FLUSH: 1 }, desc: "Expansion stream 0 to DMA" }
    - { name: exp_str_out_1, type: axis, direction: in,  params: { DATA_WIDTH: $SYS_DATA_W, HAS_FLUSH: 1 }, desc: "Expansion stream 1 to DMA" }
    - { name: exp_str_out_2, type: axis, direction: in,  params: { DATA_WIDTH: $SYS_DATA_W, HAS_FLUSH: 1 }, desc: "Expansion stream 2 to DMA" }

    # Expansion sideband
    - { name: exp_irq,   type: wire, direction: in,  params: { WIDTH: 4 }, desc: "Expansion interrupt requests" }
    - { name: exp_drq,   type: wire, direction: in,  params: { WIDTH: 2 }, desc: "Expansion DMA requests" }
    - { name: exp_dlast, type: wire, direction: out, params: { WIDTH: 2 }, desc: "DMA last signals to expansion" }

  # =============================================================================
  # Module Instances
  # =============================================================================
  # All port connections declared on the receiving instance — no separate wire_map.
  instances:
    # --- CPU Subsystem ---
    - instance_name: u_ss_cpu
      module: nanosoc_ss_cpu
      addressable: True
      params:
        CLKGATE_PRESENT: $CLKGATE_PRESENT
        BE: $BE
        BKPT: $BKPT
        DBG: $DBG
        NUMIRQ: $NUMIRQ
        SMUL: $SMUL
        SYST: $SYST
        WIC: $WIC
        WICLINES: $WICLINES
        WPT: $WPT
        RESET_ALL_REGS: $RESET_ALL_REGS
        INCLUDE_JTAG: $INCLUDE_JTAG
        ROMTABLE_BASE: $SYSTABLE_BASE
        BOOTROM_ADDR_W: $BOOTROM_ADDR_W
        IMEM_RAM_ADDR_W: $IMEM_RAM_ADDR_W
        IMEM_RAM_DATA_W: $IMEM_RAM_DATA_W
        IMEM_MEM_FPGA_IMG: $IMEM_MEM_FPGA_IMG
        DMEM_RAM_ADDR_W: $DMEM_RAM_ADDR_W
        DMEM_RAM_DATA_W: $DMEM_RAM_DATA_W
      connections:
        # Clocks and resets
        - { port: sys_fclk,        conn: u_ss_systemctrl.SYS_FCLK }
        - { port: sys_sysresetn,   conn: sys_sysresetn }
        - { port: sys_scanenable,  conn: sys_scanenable }
        - { port: sys_testmode,    conn: sys_testmode }
        - { port: sys_sysresetreq, conn: sys_sysresetreq }
        # AHB interconnect
        - { port: cpu_0,           conn: nanosoc_ahb_interconnect.cpu_0 }
        - { port: cpu_ss,          conn: nanosoc_ahb_interconnect.cpu_ss }
        # Memory remap (from assigns)
        - { port: sys_remap_ctrl,  conn: sys_remap_ctrl }
        # Power management
        - { port: cpu_0_pmuenable, conn: u_ss_systemctrl.SYS_PMUENABLE }
        # Interrupts (from assigns)
        - { port: cpu_0_nmi,       conn: cpu_0_nmi }
        - { port: cpu_0_irq,       conn: cpu_0_irq }
        - { port: cpu_0_rxev,      conn: cpu_0_rxev }
        # SWD
        - { port: cpu_0_swd,       conn: cpu_0_swd }

    # --- DMA Subsystem ---
    - instance_name: u_ss_dma
      module: nanosoc_ss_dma
      addressable: True
      params:
        SYS_ADDR_W: $SYS_ADDR_W
        SYS_DATA_W: $SYS_DATA_W
        APB_ADDR_W: $APB_ADDR_W
        APB_DATA_W: $APB_DATA_W
        DMAC_0_TYPE: $DMAC_0_TYPE
        DMAC_1_TYPE: $DMAC_1_TYPE
        DMAC_0_CHANNEL_NUM: $DMAC_0_CHANNEL_NUM
        DMAC_1_CHANNEL_NUM: $DMAC_1_CHANNEL_NUM
      connections:
        # Clocks and resets
        - { port: sys_hclk,    conn: u_ss_cpu.sys_hclk }
        - { port: sys_hresetn, conn: u_ss_cpu.sys_hresetn }
        - { port: sys_pclk,    conn: u_ss_systemctrl.SYS_PCLK }
        - { port: sys_pclkg,   conn: u_ss_systemctrl.SYS_PCLKG }
        - { port: sys_presetn, conn: u_ss_systemctrl.SYS_PRESETn }
        - { port: sys_pclken,  conn: u_ss_systemctrl.SYS_PCLKEN }
        # AHB interconnect
        - { port: dmac_0,    conn: nanosoc_ahb_interconnect.dmac_0 }
        - { port: dmac_1,    conn: nanosoc_ahb_interconnect.dmac_1 }
        - { port: dmac_ctrl, conn: nanosoc_ahb_interconnect.dmac_ctrl }
        # AXI-Stream to/from expansion
        - { port: dmac_str_out_0, conn: exp_str_in_0 }
        - { port: dmac_str_out_1, conn: exp_str_in_1 }
        - { port: dmac_str_out_2, conn: exp_str_in_2 }
        - { port: dmac_str_in_0,  conn: exp_str_out_0 }
        - { port: dmac_str_in_1,  conn: exp_str_out_1 }
        - { port: dmac_str_in_2,  conn: exp_str_out_2 }
        # DMA request/status (from assigns)
        - { port: dmac_0_dma_req, conn: dmac_0_dma_req }

    # --- Debug Subsystem ---
    - instance_name: u_ss_debug
      module: nanosoc_ss_debug
      addressable: False
      params:
        SYS_ADDR_W: $SYS_ADDR_W
        SYS_DATA_W: $SYS_DATA_W
        PROMPT_CHAR: $PROMPT_CHAR
      connections:
        # Clocks and resets
        - { port: SYS_HCLK,    conn: u_ss_cpu.sys_hclk }
        - { port: SYS_HRESETn, conn: u_ss_cpu.sys_hresetn }
        - { port: SYS_PCLK,    conn: u_ss_systemctrl.SYS_PCLK }
        - { port: SYS_PCLKG,   conn: u_ss_systemctrl.SYS_PCLKG }
        - { port: SYS_PRESETn, conn: u_ss_systemctrl.SYS_PRESETn }
        # AHB interconnect
        - { port: DEBUG, conn: nanosoc_ahb_interconnect.debug }
        # ADP byte streams (to/from extio) — expanded to individual signals
        - { port: ADP_RXD_TVALID_o, conn: u_ss_hostio4.ADP_RXD_TVALID }
        - { port: ADP_RXD_TDATA_o,  conn: u_ss_hostio4.ADP_RXD_TDATA }
        - { port: ADP_RXD_TREADY_i, conn: u_ss_hostio4.ADP_RXD_TREADY }
        - { port: ADP_TXD_TVALID_i, conn: u_ss_hostio4.ADP_TXD_TVALID }
        - { port: ADP_TXD_TDATA_i,  conn: u_ss_hostio4.ADP_TXD_TDATA }
        - { port: ADP_TXD_TREADY_o, conn: u_ss_hostio4.ADP_TXD_TREADY }
        # APB slave (USRT on soc_peripheral extension port 14)
        - { port: DEBUG_PSEL,    conn: u_ss_systemctrl.USRT_PSEL }
        - { port: DEBUG_PADDR,   conn: "u_ss_systemctrl.SOC_PERIPHERAL_PADDR[11:2]" }
        - { port: DEBUG_PENABLE, conn: u_ss_systemctrl.SOC_PERIPHERAL_PENABLE }
        - { port: DEBUG_PWRITE,  conn: u_ss_systemctrl.SOC_PERIPHERAL_PWRITE }
        - { port: DEBUG_PWDATA,  conn: u_ss_systemctrl.SOC_PERIPHERAL_PWDATA }
        # GPIO
        - { port: GPI8, conn: adp_gpi8 }
        # Intentionally unconnected outputs
        - { port: DEBUG_TXINT,    conn: unconnected, desc: "USRT TX interrupt — not used at SoC level" }
        - { port: DEBUG_RXINT,    conn: unconnected, desc: "USRT RX interrupt — not used at SoC level" }
        - { port: DEBUG_TXOVRINT, conn: unconnected, desc: "USRT TX overrun interrupt — not used at SoC level" }
        - { port: DEBUG_RXOVRINT, conn: unconnected, desc: "USRT RX overrun interrupt — not used at SoC level" }
        - { port: DEBUG_UARTINT,  conn: unconnected, desc: "USRT combined interrupt — not used at SoC level" }

    # --- FT1248 Controller (standalone IP, no YAML module file) ---
    - instance_name: u_ft1248_control
      rtl_module: socdebug_ft1248_control
      addressable: False
      params:
        FT1248_WIDTH: $FT1248_WIDTH
        FT1248_CLKON: $FT1248_CLKON
      interfaces:
        - { name: clk,          type: wire,      direction: in,  params: { WIDTH: 1 },             desc: "Clock" }
        - { name: resetn,       type: wire,      direction: in,  params: { WIDTH: 1 },             desc: "Reset (active low)" }
        - { name: ft_clkdiv,    type: wire,      direction: in,  params: { WIDTH: 8 },             desc: "Clock division ratio" }
        - { name: ft_clk_o,     type: wire,      direction: out, params: { WIDTH: 1 },             desc: "FT1248 SCLK" }
        - { name: ft_ssn_o,     type: wire,      direction: out, params: { WIDTH: 1 },             desc: "FT1248 SS_N" }
        - { name: ft_miso_i,    type: wire,      direction: in,  params: { WIDTH: 1 },             desc: "FT1248 MISO" }
        - { name: ft_miosio_o,  type: wire,      direction: out, params: { WIDTH: $FT1248_WIDTH }, desc: "FT1248 MIOSIO output" }
        - { name: ft_miosio_e,  type: wire,      direction: out, params: { WIDTH: $FT1248_WIDTH }, desc: "FT1248 MIOSIO output enable" }
        - { name: ft_miosio_i,  type: wire,      direction: in,  params: { WIDTH: $FT1248_WIDTH }, desc: "FT1248 MIOSIO input" }
        - { name: txd,          type: axis_byte, direction: out, params: {},                        desc: "TX byte stream to ADP" }
        - { name: rxd,          type: axis_byte, direction: in,  params: {},                        desc: "RX byte stream from ADP" }
      connections:
        - { port: clk,        conn: u_ss_cpu.sys_hclk }
        - { port: resetn,     conn: u_ss_cpu.sys_hresetn }
        - { port: ft_clkdiv,  conn: u_ss_debug.DEBUG_INVBAUDDIV8 }
        - { port: ft_clk_o,   conn: u_ss_hostio4.FT_CLK_O }
        - { port: ft_ssn_o,   conn: u_ss_hostio4.FT_SSN_O }
        - { port: ft_miso_i,  conn: u_ss_hostio4.FT_MISO_I }
        - { port: "ft_miosio_o[0]", conn: u_ss_hostio4.FT_MIOSIO_O }
        - { port: "ft_miosio_e[0]", conn: u_ss_hostio4.FT_MIOSIO_E }
        - { port: "ft_miosio_i[0]", conn: u_ss_hostio4.FT_MIOSIO_I }
        # TX byte stream (to extio) — expanded to individual signals
        - { port: txd_tvalid, conn: u_ss_hostio4.FT_ADP_TXD_TVALID }
        - { port: txd_tdata,  conn: u_ss_hostio4.FT_ADP_TXD_TDATA }
        - { port: txd_tready, conn: u_ss_hostio4.FT_ADP_TXD_TREADY }
        - { port: txd_tlast,  conn: unconnected, desc: "TX last signal — not used in byte mode" }
        # RX byte stream (from extio) — expanded to individual signals
        - { port: rxd_tvalid, conn: u_ss_hostio4.FT_ADP_RXD_TVALID }
        - { port: rxd_tdata,  conn: u_ss_hostio4.FT_ADP_RXD_TDATA }
        - { port: rxd_tready, conn: u_ss_hostio4.FT_ADP_RXD_TREADY }
        - { port: rxd_tlast,  conn: unconnected, desc: "RX last signal — not used in byte mode" }

    # --- System Control Subsystem ---
    - instance_name: u_ss_systemctrl
      module: nanosoc_ss_systemctrl
      addressable: True
      params:
        SYS_ADDR_W: $SYS_ADDR_W
        SYS_DATA_W: $SYS_DATA_W
        APB_ADDR_W: $APB_ADDR_W
        APB_DATA_W: $APB_DATA_W
        CLKGATE_PRESENT: $CLKGATE_PRESENT
      connections:
        # Clocks and resets
        - { port: SYS_CLK,            conn: sys_clk }
        - { port: SYS_HCLK,           conn: u_ss_cpu.sys_hclk }
        - { port: SYS_SYSRESETn,      conn: sys_sysresetn }
        - { port: SYS_PORESETn,       conn: u_ss_cpu.sys_poresetn }
        - { port: SYS_HRESETn,        conn: u_ss_cpu.sys_hresetn }
        - { port: SYS_TESTMODE,       conn: sys_testmode }
        # AHB interconnect
        - { port: SOC_PERIPHERAL,     conn: nanosoc_ahb_interconnect.soc_peripheral }
        # APB extension: USRT from debug subsystem
        - { port: USRT_PRDATA,        conn: u_ss_debug.DEBUG_PRDATA }
        - { port: USRT_PREADY,        conn: u_ss_debug.DEBUG_PREADY }
        - { port: USRT_PSLVERR,       conn: u_ss_debug.DEBUG_PSLVERR }
        # Address Remap control
        - { port: SYS_REMAP_CTRL,     conn: "sys_remap_ctrl[0]" }
        # CPU status
        - { port: CPU_SYSRESETREQ,    conn: u_ss_cpu.cpu_0_sysresetreq }
        - { port: CPU_PRMURESETREQ,   conn: u_ss_cpu.cpu_0_prmuresetreq }
        - { port: SYS_PMUDBGRESETREQ, conn: u_ss_cpu.cpu_0_pmudbgresetreq }
        - { port: CPU_LOCKUP,         conn: u_ss_cpu.cpu_0_lockup }
        - { port: CPU_SLEEPING,       conn: u_ss_cpu.cpu_0_sleeping }
        - { port: CPU_SLEEPDEEP,      conn: u_ss_cpu.cpu_0_sleepdeep }
        # USRT byte streams (from extio) — expanded to individual signals
        - { port: USRT0_RXD_TVALID, conn: u_ss_hostio4.USRT0_RXD_TVALID }
        - { port: USRT0_RXD_TDATA,  conn: u_ss_hostio4.USRT0_RXD_TDATA }
        - { port: USRT0_RXD_TREADY, conn: u_ss_hostio4.USRT0_RXD_TREADY }
        - { port: USRT1_RXD_TVALID, conn: u_ss_hostio4.USRT1_RXD_TVALID }
        - { port: USRT1_RXD_TDATA,  conn: u_ss_hostio4.USRT1_RXD_TDATA }
        - { port: USRT1_RXD_TREADY, conn: u_ss_hostio4.USRT1_RXD_TREADY }
        # GPIO
        - { port: P0_IN,              conn: p0_in }
        - { port: P1_IN,              conn: sys_p1_in }

    # --- HOSTIO4 Subsystem ---
    - instance_name: u_ss_hostio4
      module: nanosoc_ss_hostio4
      addressable: False
      params: {}
      connections:
        # Clocks and resets
        - { port: SYS_HCLK,    conn: u_ss_cpu.sys_hclk }
        - { port: SYS_HRESETn, conn: u_ss_cpu.sys_hresetn }
        - { port: SYS_TESTMODE, conn: sys_testmode }
        - { port: FT1248MODE,   conn: "p1_in[7]" }
        # ADP byte streams (from debug) — expanded to individual signals
        - { port: ADP_RXD_TVALID, conn: u_ss_debug.ADP_RXD_TVALID_o }
        - { port: ADP_RXD_TDATA,  conn: u_ss_debug.ADP_RXD_TDATA_o }
        - { port: ADP_RXD_TREADY, conn: u_ss_debug.ADP_RXD_TREADY_i }
        - { port: ADP_TXD_TVALID, conn: u_ss_debug.ADP_TXD_TVALID_i }
        - { port: ADP_TXD_TDATA,  conn: u_ss_debug.ADP_TXD_TDATA_i }
        - { port: ADP_TXD_TREADY, conn: u_ss_debug.ADP_TXD_TREADY_o }
        # USRT byte streams (from systemctrl) — expanded to individual signals
        - { port: USRT0_TXD_TVALID, conn: u_ss_systemctrl.USRT0_TXD_TVALID }
        - { port: USRT0_TXD_TDATA,  conn: u_ss_systemctrl.USRT0_TXD_TDATA }
        - { port: USRT0_TXD_TREADY, conn: u_ss_systemctrl.USRT0_TXD_TREADY }
        - { port: USRT1_TXD_TVALID, conn: u_ss_systemctrl.USRT1_TXD_TVALID }
        - { port: USRT1_TXD_TDATA,  conn: u_ss_systemctrl.USRT1_TXD_TDATA }
        - { port: USRT1_TXD_TREADY, conn: u_ss_systemctrl.USRT1_TXD_TREADY }
        # GPIO P1[6:0] pads
        - { port: P1_IN,    conn: "p1_in[6:0]" }
        # GPIO P1 system (from systemctrl)
        - { port: SYS_P1_OUT_MUX,    conn: "u_ss_systemctrl.P1_OUT_MUX[6:4]" }
        - { port: SYS_P1_OUT_EN_MUX, conn: "u_ss_systemctrl.P1_OUT_EN_MUX[6:4]" }

    # --- Expansion SRAM 0 ---
    - instance_name: u_region_sram_0
      module: nanosoc_region_sram
      addressable: True
      params: { SYS_ADDR_W: $SYS_ADDR_W, SYS_DATA_W: $SYS_DATA_W, RAM_ADDR_W: $SRAM_0_RAM_ADDR_W, RAM_DATA_W: $SRAM_0_RAM_DATA_W }
      connections:
        - { port: HCLK,      conn: u_ss_cpu.sys_hclk }
        - { port: HRESETn,   conn: u_ss_cpu.sys_hresetn }
        - { port: ahb_slave, conn: nanosoc_ahb_interconnect.sram_0 }

    # --- Expansion SRAM 1 ---
    - instance_name: u_region_sram_1
      module: nanosoc_region_sram
      addressable: True
      params: { SYS_ADDR_W: $SYS_ADDR_W, SYS_DATA_W: $SYS_DATA_W, RAM_ADDR_W: $SRAM_1_RAM_ADDR_W, RAM_DATA_W: $SRAM_1_RAM_DATA_W }
      connections:
        - { port: HCLK,      conn: u_ss_cpu.sys_hclk }
        - { port: HRESETn,   conn: u_ss_cpu.sys_hresetn }
        - { port: ahb_slave, conn: nanosoc_ahb_interconnect.sram_1 }

    # --- System ROM Table ---
    - instance_name: u_region_systable
      module: nanosoc_region_systable
      addressable: True
      params: { SYS_ADDR_W: $SYS_ADDR_W, SYS_DATA_W: $SYS_DATA_W, SYSTABLE_BASE: $SYSTABLE_BASE, SOCLABS_JEPID: $SOCLABS_JEPID, NANOSOC_PARTNUMBER: $NANOSOC_PARTNUMBER, NANOSOC_REVISION: $NANOSOC_REVISION }
      connections:
        - { port: HCLK,      conn: u_ss_cpu.sys_hclk }
        - { port: ahb_slave, conn: nanosoc_ahb_interconnect.systable }

  # =============================================================================
  # Combinational Assigns — Glue Logic
  # =============================================================================
  # Single source of truth for all combinational logic including interrupt routing.
  # Interrupt assigns tagged with type: interrupt for tool extraction.
  internal_wires:
    # --- Shared nets driven by top-level glue logic ---
    - { name: sys_remap_ctrl,    type: wire, params: { WIDTH: 4 },                   desc: "Shared remap bus between u_ss_systemctrl.SYS_REMAP_CTRL[0], u_ss_cpu.sys_remap_ctrl, and nanosoc_ahb_interconnect.sys_remap_ctrl" }
    - { name: cpu_0_irq,         type: wire, params: { WIDTH: 32 },                  desc: "Interrupt vector net driving u_ss_cpu.cpu_0_irq" }
    - { name: cpu_0_nmi,         type: wire, params: { WIDTH: 1 },                   desc: "NMI net driving u_ss_cpu.cpu_0_nmi" }
    - { name: cpu_0_rxev,        type: wire, params: { WIDTH: 1 },                   desc: "Receive-event net driving u_ss_cpu.cpu_0_rxev" }
    - { name: sys_gpio0_any_irq, type: wire, params: { WIDTH: 1 },                   desc: "Reduced GPIO0 interrupt used in cpu_0_irq[6]" }
    - { name: sys_gpio1_any_irq, type: wire, params: { WIDTH: 1 },                   desc: "Reduced GPIO1 interrupt used in cpu_0_irq[7]" }
    - { name: sys_sysresetreq,   type: wire, params: { WIDTH: 1 },                   desc: "Combined system reset request net driving u_ss_cpu.sys_sysresetreq" }
    - { name: debug_resetreq,    type: wire, params: { WIDTH: 1 },                   desc: "Debug reset request derived from u_ss_debug.GPO8[0]" }
    - { name: dmac_0_dma_req,    type: wire, params: { WIDTH: $DMAC_0_CHANNEL_NUM }, desc: "DMA request bus driving u_ss_dma.dmac_0_dma_req" }
    - { name: adp_gpi8,          type: wire, params: { WIDTH: 8 },                   desc: "ADP GPIO loopback net driving u_ss_debug.GPI8" }
    - { name: lockup_resetreq,   type: wire, params: { WIDTH: 1 },                   desc: "Intermediate: lockup AND reset-on-lockup config, feeds into sysresetreq combiner" }
    - { name: sys_p1_out,        type: wire, params: { WIDTH: 16 },                  desc: "GPIO P1 output bus used to gate EXTIO DMA request generation" }

  glue_logic:
    # --- Address remap control ---
    - name: remap_upper_tie
      type: constant
      value: 0
      width: 3
      output: sys_remap_ctrl[3:1]
      desc: "Tie off remap upper bits; bit[0] comes from u_ss_systemctrl.SYS_REMAP_CTRL"

    # --- Interrupt routing ---
    - name: gpio0_irq_reduce
      type: or_reduce
      input: u_ss_systemctrl.SYS_GPIO0_IRQ
      output: sys_gpio0_any_irq
      desc: "OR reduction of GPIO0 interrupts"

    - name: gpio1_irq_reduce
      type: or_reduce
      input: u_ss_systemctrl.SYS_GPIO1_IRQ
      output: sys_gpio1_any_irq
      desc: "OR reduction of GPIO1 interrupts"

    - name: irq_3_0_route
      type: passthrough
      input: u_ss_systemctrl.SYS_APB_IRQ[3:0]
      output: cpu_0_irq[3:0]
      desc: "UART0/1 RX/TX IRQs"

    - name: irq_5_4_route
      type: passthrough
      input: u_ss_systemctrl.SYS_APB_IRQ[5:4]
      output: cpu_0_irq[5:4]
      desc: "UART2 RX/TX IRQs"

    - name: irq_6_combine
      type: or_combine
      inputs:
        - u_ss_systemctrl.SYS_APB_IRQ[6]
        - sys_gpio0_any_irq
      output: cpu_0_irq[6]
      desc: "GPIO0 combined interrupt OR APB IRQ[6]"

    - name: irq_7_combine
      type: or_combine
      inputs:
        - u_ss_systemctrl.SYS_APB_IRQ[7]
        - sys_gpio1_any_irq
      output: cpu_0_irq[7]
      desc: "GPIO1 combined interrupt OR APB IRQ[7]"

    - name: irq_10_8_route
      type: passthrough
      input: u_ss_systemctrl.SYS_APB_IRQ[10:8]
      output: cpu_0_irq[10:8]
      desc: "Timer IRQs"

    - name: irq_14_11_route
      type: passthrough
      input: exp_irq[3:0]
      output: cpu_0_irq[14:11]
      desc: "Expansion IRQs"

    - name: irq_15_combine
      type: or_combine
      inputs:
        - u_ss_systemctrl.SYS_APB_IRQ[15]
        - u_ss_dma.dmac_any_done
        - u_ss_dma.dmac_any_error
      output: cpu_0_irq[15]
      desc: "DMA done/error OR APB IRQ[15]"

    - name: irq_31_16_combine
      type: or_combine
      inputs:
        - u_ss_systemctrl.SYS_APB_IRQ[31:16]
        - u_ss_systemctrl.SYS_GPIO0_IRQ[15:0]
      output: cpu_0_irq[31:16]
      desc: "Upper interrupt vector: APB IRQs OR GPIO0 per-pin IRQs"

    - name: nmi_route
      type: passthrough
      input: u_ss_systemctrl.SYS_NMI
      output: cpu_0_nmi
      desc: "Watchdog NMI into CPU"

    # --- Reset combining ---
    - name: debug_resetreq_route
      type: passthrough
      input: u_ss_debug.GPO8[0]
      output: debug_resetreq
      desc: "Debug reset request from ADP GPIO"

    - name: lockup_reset_gate
      type: and_gate
      inputs:
        - u_ss_systemctrl.SYS_LOCKUPRESET
        - u_ss_cpu.cpu_0_lockup
      output: lockup_resetreq
      desc: "Lockup reset gated by lockup status"

    - name: sysresetreq_combine
      type: or_combine
      inputs:
        - u_ss_cpu.cpu_0_sysresetreq
        - debug_resetreq
        - u_ss_systemctrl.SYS_WDOGRESETREQ
        - lockup_resetreq
      output: sys_sysresetreq
      desc: "Combined system reset request"

    # --- DMA request routing ---
    - name: exp_dlast_tie
      type: constant
      value: 0
      width: 2
      output: exp_dlast[1:0]
      desc: "DMA last signals tied low on expansion output"

    - name: dma_req_1_0_route
      type: passthrough
      input: exp_drq
      output: dmac_0_dma_req[1:0]
      desc: "Expansion DMA request inputs"

    - name: dma_req_2_gate
      type: and_gate
      inputs:
        - u_ss_hostio4.EXT_DAT_RXD_TREADY
        - sys_p1_out[2]
      output: dmac_0_dma_req[2]
      desc: "EXTIO RX-ready request gated by P1[2]"

    - name: dma_req_3_gate
      type: and_gate
      inputs:
        - u_ss_hostio4.EXT_DAT_TXD_TVALID
        - sys_p1_out[3]
      output: dmac_0_dma_req[3]
      desc: "EXTIO TX-valid request gated by P1[3]"

    # --- Signal loopbacks and events ---
    - name: adp_gpio_loopback
      type: passthrough
      input: u_ss_debug.GPO8
      output: adp_gpi8
      desc: "Loop back ADP GPO8 into GPI8"

    - name: cpu_rxev_route
      type: passthrough
      input: u_ss_dma.dmac_any_done
      output: cpu_0_rxev
      desc: "DMA completion event into CPU receive-event"

    # --- Top-level output port drivers ---
    - name: sys_hclk_route
      type: passthrough
      input: u_ss_cpu.sys_hclk
      output: sys_hclk
      desc: "Route generated AHB clock to top-level output"

    - name: sys_hresetn_route
      type: passthrough
      input: u_ss_cpu.sys_hresetn
      output: sys_hresetn
      desc: "Route generated AHB reset to top-level output"

    - name: sys_xtalclk_out_route
      type: passthrough
      input: u_ss_systemctrl.SYS_XTALCLK_OUT
      output: sys_xtalclk_out
      desc: "Route crystal clock output to top-level"

    - name: p0_out_route
      type: passthrough
      input: u_ss_systemctrl.P0_OUT
      output: p0_out
      desc: "Route GPIO P0 output to top-level pads"

    - name: p0_outen_route
      type: passthrough
      input: u_ss_systemctrl.P0_OUTEN
      output: p0_outen
      desc: "Route GPIO P0 output enable to top-level pads"

    - name: p1_out_lower_route
      type: passthrough
      input: u_ss_hostio4.P1_OUT
      output: p1_out[6:0]
      desc: "Route extio P1[6:0] to top-level pads"

    - name: p1_outen_lower_route
      type: passthrough
      input: u_ss_hostio4.P1_OUTEN
      output: p1_outen[6:0]
      desc: "Route extio P1[6:0] output enable to top-level pads"

    - name: p1_out_upper_tie
      type: constant
      value: 0
      width: 9
      output: p1_out[15:7]
      desc: "Tie off upper P1 output bits (no external connection)"

    - name: p1_outen_upper_tie
      type: constant
      value: 0
      width: 9
      output: p1_outen[15:7]
      desc: "Tie off upper P1 output enable bits"

    - name: sys_p1_out_route
      type: passthrough
      input: u_ss_systemctrl.P1_OUT
      output: sys_p1_out
      desc: "Route systemctrl P1_OUT to internal wire for DMA request gating"

  # =============================================================================
  # Interconnects and Address Map
  # =============================================================================
  interconnects:
    - name: nanosoc_ahb_interconnect
      gen: True
      type: ahb_lite
      desc: >
        4-initiator x 7-target AHB Lite bus matrix. CPU local memories (bootrom,
        imem, dmem) are encapsulated inside cpu_ss — accessible via the cpu_ss
        slave port which contains its own internal busmatrix.

      params:
        SYS_ADDR_W: $SYS_ADDR_W
        SYS_DATA_W: $SYS_DATA_W

      connections:
        # These port names are defined by the template for ahb_lite interconnects and must match exactly.
        # TODO: rename the interconnect template ports to be more generic and less tied to the system names.
        - { port: sys_hclk,        conn: u_ss_cpu.sys_hclk }
        - { port: sys_hresetn,     conn: u_ss_cpu.sys_hresetn }
        - { port: sys_scanenable,  conn: sys_scanenable }
        - { port: sys_scaninhclk,  conn: sys_scaninhclk }
        - { port: sys_scanouthclk, conn: sys_scanouthclk }
        - { port: sys_remap_ctrl,  conn: sys_remap_ctrl }

      targets:
        - { name: cpu_ss,          instance: u_ss_cpu,          base: 0x00000000, size: 0x20000000, sw_access: rwx, region_type: memory, role: None, subordinate_bus: True, desc: "CPU subsystem slave (internal busmatrix: bootrom, imem, dmem)" }
        - { name: soc_peripheral,  instance: u_ss_systemctrl,   base: 0x40000000, size: 0x10000000, sw_access: rw,  region_type: periph, role: None, desc: "SoC peripherals (timers, UARTs, watchdog, GPIO, sysctrl)" }
        - { name: dmac_ctrl,       instance: u_ss_dma,          base: 0x50000000, size: 0x10000000, sw_access: rw,  region_type: periph, role: None, desc: "DMA controller config registers (APB-bridged)" }
        - { name: exp,                                          base: 0x60000000, size: 0x20000000, sw_access: rw,  region_type: periph, role: None, desc: "Expansion region for custom accelerators (external port)" }
        - { name: sram_0,          instance: u_region_sram_0,   base: 0x80000000, size: 0x10000000, phys_size: "4 * (2 ** $SRAM_0_RAM_ADDR_W)", sw_access: rwx, region_type: memory, role: None, desc: "Expansion SRAM bank 0" }
        - { name: sram_1,          instance: u_region_sram_1,   base: 0x90000000, size: 0x10000000, phys_size: "4 * (2 ** $SRAM_1_RAM_ADDR_W)", sw_access: rwx, region_type: memory, role: None, desc: "Expansion SRAM bank 1" }
        - { name: systable,        instance: u_region_systable, base: 0xF0000000, size: 0x00040000, sw_access: ro,  region_type: periph, role: None, desc: "CoreSight system ROM table" }

      initiators:
        - name: cpu_0
          instance: u_ss_cpu
          targets:
            - name: soc_peripheral
            - name: dmac_ctrl
            - name: exp
            - name: sram_0
            - name: sram_1
            - name: systable

        - name: debug
          instance: u_ss_debug
          targets:
            - name: cpu_ss
            - name: soc_peripheral
            - name: dmac_ctrl
            - name: exp
            - name: sram_0
            - name: sram_1
            - name: systable

        - name: dmac_0
          instance: u_ss_dma
          targets:
            - name: cpu_ss
            - name: soc_peripheral
            - name: exp
            - name: sram_0
            - name: sram_1

        - name: dmac_1
          instance: u_ss_dma
          targets:
            - name: cpu_ss
            - name: soc_peripheral
            - name: exp
            - name: sram_0
            - name: sram_1

  # =============================================================================
  # Firmware Configuration
  # =============================================================================
  firmware:
    cpu_initiator: cpu_0

    linker_profiles:
      - name: cmsdk_cm0
        regions:
          - { target: imem_0, address_select: remapped }
          - { target: dmem_0, address_select: default, size_adjust: -0x400 }

      - name: cmsdk_bootloader
        regions:
          - { target: bootrom_0, address_select: alias }
          - { target: dmem_0,    address_select: default, size_adjust: -0x400 }

      - name: debugtester
        regions:
          - { target: imem_0, address_select: remapped, phys_size: 0x20000 }
          - { target: imem_0, linker_name: IMEM_0_RAM, software_access: rwx, address_select: default, phys_size: 0x4000 }

    adp:
      upload_target: imem_0
      address_select: default

    hex_adjust:
      bootloader:
        target: bootrom_0
        address_select: alias

  # =============================================================================
  # Build Info Registers
  # =============================================================================
  # Auto-generated read-only APB peripheral exposing build metadata.
  # Fields with type 'timestamp' and 'git_hash' are captured at generation time.
  build_info:
    apb_slot: 3
    gen: True
    fields:
      - { name: GEN_TIMESTAMP,  type: timestamp,  desc: "Generation timestamp (Unix epoch)" }
      - { name: REPO_GIT_HASH,  type: git_hash,   desc: "Repo git hash (truncated 32-bit)" }
      - { name: TOOL_GIT_HASH,  type: git_hash,   source: tool, desc: "Tool git hash (truncated 32-bit)" }
      - { name: SOC_VERSION,    type: int32,       value: 0x00010000, desc: "SoC version (major.minor packed)" }
      - { name: DEVELOPER,      type: string,      value: "DaveM",    max_length: 16, desc: "Developer name" }
      - { name: COMPANY,        type: string,      value: "SoCLabs",  max_length: 16, desc: "Developer company" }
      - { name: DESIGN_NAME,    type: string,      value: "NanoSoC-M0", max_length: 12, desc: "Design name" }
