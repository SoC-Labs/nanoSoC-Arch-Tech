#-----------------------------------------------------------------------------
# This module wraps the nanosoc core and connects the expansion region port
# (EXP) to a default AHB slave. Users should replace nanosoc_region_exp_default
# with their own accelerator IP.
#
# Generated by nanosoc_gen — do not edit directly.

module:
  name: nanosoc_system
  gen: True
  desc: >
    NanoSoC system integration level. Wraps the nanosoc core module and
    connects its expansion region port to a user-replaceable expansion
    region. By default, a cmsdk_ahb_default_slave is placed on the expansion
    AHB port. Users should replace nanosoc_region_exp_default with their
    own accelerator subsystem.

  # =============================================================================
  # Design Parameters
  # =============================================================================
  params:
    # System bus
    SYS_ADDR_W:         { type: int, default: 32,           desc: "System address width" }
    SYS_DATA_W:         { type: int, default: 32,           desc: "System data width" }

    # Accelerator Expansion Region
    ACCELERATOR_SUBSYSTEM: { type: int, default: 0,         desc: "Enable accelerator in expansion region" }

    # Widths of System Peripheral APB Subsystem
    APB_ADDR_W:         { type: int, default: 12,           desc: "APB peripheral address width" }
    APB_DATA_W:         { type: int, default: 32,           desc: "APB peripheral data width" }

    # Bootrom 0 Parameters
    BOOTROM_ADDR_W:     { type: int, default: 11,           desc: "Boot ROM address width (default 2KB)" }

    # IMEM 0 Parameters
    IMEM_RAM_ADDR_W:    { type: int, default: 14,           desc: "IMEM address width (default 16KB)" }
    IMEM_RAM_DATA_W:    { type: int, default: 32,           desc: "IMEM data width" }
    IMEM_MEM_FPGA_IMG:  { type: str, default: "image.hex",  desc: "FPGA image to preload into IMEM" }

    # DMEM 0 Parameters
    DMEM_RAM_ADDR_W:    { type: int, default: 14,           desc: "DMEM address width (default 16KB)" }
    DMEM_RAM_DATA_W:    { type: int, default: 32,           desc: "DMEM data width" }

    # Expansion SRAM Low Parameters
    SRAM_0_RAM_ADDR_W:  { type: int, default: 14,           desc: "Expansion SRAM 0 address width (default 16KB)" }
    SRAM_0_RAM_DATA_W:  { type: int, default: 32,           desc: "Expansion SRAM 0 data width" }

    # Expansion SRAM High Parameters
    SRAM_1_RAM_ADDR_W:  { type: int, default: 14,           desc: "Expansion SRAM 1 address width (default 16KB)" }
    SRAM_1_RAM_DATA_W:  { type: int, default: 32,           desc: "Expansion SRAM 1 data width" }

    # CPU Parameters
    CLKGATE_PRESENT:    { type: int, default: 0,            desc: "Clock gating present" }
    BE:                 { type: int, default: 0,            desc: "Endianness: 0=little, 1=big" }
    BKPT:               { type: int, default: 4,            desc: "Number of breakpoint comparators" }
    DBG:                { type: int, default: 1,            desc: "Debug configuration enable" }
    NUMIRQ:             { type: int, default: 32,           desc: "Number of IRQ lines" }
    SMUL:               { type: int, default: 0,            desc: "Multiplier: 0=small, 1=fast" }
    SYST:               { type: int, default: 1,            desc: "SysTick enable" }
    WIC:                { type: int, default: 1,            desc: "Wake-up interrupt controller" }
    WICLINES:           { type: int, default: 34,           desc: "WIC lines" }
    WPT:                { type: int, default: 2,            desc: "Number of DWT comparators" }
    RESET_ALL_REGS:     { type: int, default: 1,            desc: "Reset all registers" }
    INCLUDE_JTAG:       { type: int, default: 0,            desc: "Include JTAG feature" }

    # DMA Parameters
    DMAC_0_TYPE:        { type: int, default: 0,            desc: "DMAC 0 type: 0=None, 1=PL230, 2=DMA350" }
    DMAC_1_TYPE:        { type: int, default: 0,            desc: "DMAC 1 type: 0=None, 1=PL230" }
    DMAC_0_CHANNEL_NUM: { type: int, default: 4,            desc: "DMAC 0 channel count" }
    DMAC_1_CHANNEL_NUM: { type: int, default: 2,            desc: "DMAC 1 channel count" }

    # SoCDebug / FTDI
    PROMPT_CHAR:        { type: str, default: "]",          desc: "SoCDebug prompt character" }
    FT1248_WIDTH:       { type: int, default: 1,            desc: "FTDI interface width: 1, 2, or 4" }
    FT1248_CLKON:       { type: int, default: 1,            desc: "FTDI clock always on" }
    FT1248_CLKDIV:      { type: int, default: 15,           desc: "FTDI clock divider ratio" }

    # System identification
    SYSTABLE_BASE:      { type: int, default: 0xF0000000,   desc: "System ROM table base address" }
    SOCLABS_JEPID:      { type: int, default: 0x51,         desc: "SoC Labs JEDEC manufacturer ID" }
    NANOSOC_PARTNUMBER: { type: int, default: 0x001,        desc: "NanoSoC part number" }
    NANOSOC_REVISION:   { type: int, default: 0x1,          desc: "NanoSoC revision" }

    # QSPI Flash
    QSPI_FLASH_PRESENT: { type: int, default: 0,            desc: "QSPI flash present: 0=No (1-stage ADP boot), 1=Yes (2-stage flash boot)" }
    QSPI_ADDR_W:        { type: int, default: 22,           desc: "QSPI flash address width (phys = 2^N bytes, default 4 MB)" }

  # =============================================================================
  # Interfaces (external ports of nanosoc_system)
  # =============================================================================
  interfaces:
    # Clock and Reset
    - { name: SYS_CLK,         type: wire, direction: in,  params: { WIDTH: 1 }, desc: "System input clock" }
    - { name: SYS_SYSRESETn,   type: wire, direction: in,  params: { WIDTH: 1 }, desc: "System reset (active low)" }
    - { name: SYS_XTALCLK_OUT, type: wire, direction: out, params: { WIDTH: 1 }, desc: "Crystal clock output" }

    # Scan/Test
    - { name: SYS_SCANENABLE,  type: wire, direction: in,  params: { WIDTH: 1 }, desc: "Scan mode enable" }
    - { name: SYS_TESTMODE,    type: wire, direction: in,  params: { WIDTH: 1 }, desc: "Test mode enable" }
    - { name: SYS_SCANINHCLK,  type: wire, direction: in,  params: { WIDTH: 1 }, desc: "HCLK scan input" }
    - { name: SYS_SCANOUTHCLK, type: wire, direction: out, params: { WIDTH: 1 }, desc: "Scan chain output" }

    # Serial Wire Debug
    - { name: CPU_0_swd, type: swd, direction: receiver, params: {}, desc: "CPU SWD debug interface" }

    # GPIO ports
    - { name: P0, type: gpio, direction: inout, params: { WIDTH: 16 }, desc: "GPIO port 0 (16 pins)" }
    - { name: P1, type: gpio, direction: inout, params: { WIDTH: 16 }, desc: "GPIO port 1 (16 pins)" }

    # QSPI Flash pads (active when QSPI_FLASH_PRESENT > 0)
    - { name: QSPI_SCLK,  type: wire, direction: out,   params: { WIDTH: 1 }, condition: "$QSPI_FLASH_PRESENT > 0", desc: "QSPI serial clock" }
    - { name: QSPI_CSN,   type: wire, direction: out,   params: { WIDTH: 1 }, condition: "$QSPI_FLASH_PRESENT > 0", desc: "QSPI chip select (active low)" }
    - { name: QSPI_IO_O,  type: wire, direction: out,   params: { WIDTH: 4 }, condition: "$QSPI_FLASH_PRESENT > 0", desc: "QSPI data output (IO[3:0])" }
    - { name: QSPI_IO_I,  type: wire, direction: in,    params: { WIDTH: 4 }, condition: "$QSPI_FLASH_PRESENT > 0", desc: "QSPI data input (IO[3:0])" }
    - { name: QSPI_IO_OE, type: wire, direction: out,   params: { WIDTH: 4 }, condition: "$QSPI_FLASH_PRESENT > 0", desc: "QSPI data output enable (IO[3:0])" }

  # =============================================================================
  # Internal Wires
  # =============================================================================
  internal_wires:
    # AHB clock and reset from nanosoc core
    - { name: SYS_HCLK,    type: wire, params: { WIDTH: 1 },            desc: "AHB clock from nanosoc core" }
    - { name: SYS_HRESETn, type: wire, params: { WIDTH: 1 },            desc: "AHB reset from nanosoc core" }

    # Expansion Region AHB Port
    - { name: EXP_HSEL,      type: wire, params: { WIDTH: 1 },              desc: "Expansion AHB select" }
    - { name: EXP_HADDR,     type: wire, params: { WIDTH: $SYS_ADDR_W },    desc: "Expansion AHB address" }
    - { name: EXP_HTRANS,    type: wire, params: { WIDTH: 2 },              desc: "Expansion AHB transfer type" }
    - { name: EXP_HSIZE,     type: wire, params: { WIDTH: 3 },              desc: "Expansion AHB transfer size" }
    - { name: EXP_HPROT,     type: wire, params: { WIDTH: 4 },              desc: "Expansion AHB protection" }
    - { name: EXP_HWRITE,    type: wire, params: { WIDTH: 1 },              desc: "Expansion AHB write" }
    - { name: EXP_HREADY,    type: wire, params: { WIDTH: 1 },              desc: "Expansion AHB ready" }
    - { name: EXP_HWDATA,    type: wire, params: { WIDTH: $SYS_DATA_W },    desc: "Expansion AHB write data" }
    - { name: EXP_HBURST,    type: wire, params: { WIDTH: 3 },              desc: "Expansion AHB burst type" }
    - { name: EXP_HMASTLOCK, type: wire, params: { WIDTH: 1 },              desc: "Expansion AHB master lock" }
    - { name: EXP_HREADYOUT, type: wire, params: { WIDTH: 1 },              desc: "Expansion AHB ready out" }
    - { name: EXP_HRESP,     type: wire, params: { WIDTH: 1 },              desc: "Expansion AHB response" }
    - { name: EXP_HRDATA,    type: wire, params: { WIDTH: $SYS_DATA_W },    desc: "Expansion AHB read data" }

    # DMA Stream 0
    - { name: EXP_STR_IN_0_TVALID,  type: wire, params: { WIDTH: 1 },            desc: "Stream 0 in valid" }
    - { name: EXP_STR_IN_0_TREADY,  type: wire, params: { WIDTH: 1 },            desc: "Stream 0 in ready" }
    - { name: EXP_STR_IN_0_TDATA,   type: wire, params: { WIDTH: $SYS_DATA_W },  desc: "Stream 0 in data" }
    - { name: EXP_STR_IN_0_TSTRB,   type: wire, params: { WIDTH: 4 },            desc: "Stream 0 in strobe" }
    - { name: EXP_STR_IN_0_TLAST,   type: wire, params: { WIDTH: 1 },            desc: "Stream 0 in last" }
    - { name: EXP_STR_OUT_0_TVALID, type: wire, params: { WIDTH: 1 },            desc: "Stream 0 out valid" }
    - { name: EXP_STR_OUT_0_TREADY, type: wire, params: { WIDTH: 1 },            desc: "Stream 0 out ready" }
    - { name: EXP_STR_OUT_0_TDATA,  type: wire, params: { WIDTH: $SYS_DATA_W },  desc: "Stream 0 out data" }
    - { name: EXP_STR_OUT_0_TSTRB,  type: wire, params: { WIDTH: 4 },            desc: "Stream 0 out strobe" }
    - { name: EXP_STR_OUT_0_TLAST,  type: wire, params: { WIDTH: 1 },            desc: "Stream 0 out last" }
    - { name: EXP_STR_OUT_0_FLUSH,  type: wire, params: { WIDTH: 1 },            desc: "Stream 0 out flush" }

    # DMA Stream 1
    - { name: EXP_STR_IN_1_TVALID,  type: wire, params: { WIDTH: 1 },            desc: "Stream 1 in valid" }
    - { name: EXP_STR_IN_1_TREADY,  type: wire, params: { WIDTH: 1 },            desc: "Stream 1 in ready" }
    - { name: EXP_STR_IN_1_TDATA,   type: wire, params: { WIDTH: $SYS_DATA_W },  desc: "Stream 1 in data" }
    - { name: EXP_STR_IN_1_TSTRB,   type: wire, params: { WIDTH: 4 },            desc: "Stream 1 in strobe" }
    - { name: EXP_STR_IN_1_TLAST,   type: wire, params: { WIDTH: 1 },            desc: "Stream 1 in last" }
    - { name: EXP_STR_OUT_1_TVALID, type: wire, params: { WIDTH: 1 },            desc: "Stream 1 out valid" }
    - { name: EXP_STR_OUT_1_TREADY, type: wire, params: { WIDTH: 1 },            desc: "Stream 1 out ready" }
    - { name: EXP_STR_OUT_1_TDATA,  type: wire, params: { WIDTH: $SYS_DATA_W },  desc: "Stream 1 out data" }
    - { name: EXP_STR_OUT_1_TSTRB,  type: wire, params: { WIDTH: 4 },            desc: "Stream 1 out strobe" }
    - { name: EXP_STR_OUT_1_TLAST,  type: wire, params: { WIDTH: 1 },            desc: "Stream 1 out last" }
    - { name: EXP_STR_OUT_1_FLUSH,  type: wire, params: { WIDTH: 1 },            desc: "Stream 1 out flush" }

    # DMA Stream 2
    - { name: EXP_STR_IN_2_TVALID,  type: wire, params: { WIDTH: 1 },            desc: "Stream 2 in valid" }
    - { name: EXP_STR_IN_2_TREADY,  type: wire, params: { WIDTH: 1 },            desc: "Stream 2 in ready" }
    - { name: EXP_STR_IN_2_TDATA,   type: wire, params: { WIDTH: $SYS_DATA_W },  desc: "Stream 2 in data" }
    - { name: EXP_STR_IN_2_TSTRB,   type: wire, params: { WIDTH: 4 },            desc: "Stream 2 in strobe" }
    - { name: EXP_STR_IN_2_TLAST,   type: wire, params: { WIDTH: 1 },            desc: "Stream 2 in last" }
    - { name: EXP_STR_OUT_2_TVALID, type: wire, params: { WIDTH: 1 },            desc: "Stream 2 out valid" }
    - { name: EXP_STR_OUT_2_TREADY, type: wire, params: { WIDTH: 1 },            desc: "Stream 2 out ready" }
    - { name: EXP_STR_OUT_2_TDATA,  type: wire, params: { WIDTH: $SYS_DATA_W },  desc: "Stream 2 out data" }
    - { name: EXP_STR_OUT_2_TSTRB,  type: wire, params: { WIDTH: 4 },            desc: "Stream 2 out strobe" }
    - { name: EXP_STR_OUT_2_TLAST,  type: wire, params: { WIDTH: 1 },            desc: "Stream 2 out last" }
    - { name: EXP_STR_OUT_2_FLUSH,  type: wire, params: { WIDTH: 1 },            desc: "Stream 2 out flush" }

    # Expansion Interrupt and DMA connections
    - { name: EXP_IRQ,   type: wire, params: { WIDTH: 4 }, desc: "Expansion interrupt requests" }
    - { name: EXP_DRQ,   type: wire, params: { WIDTH: 2 }, desc: "Expansion DMA requests" }
    - { name: EXP_DLAST, type: wire, params: { WIDTH: 2 }, desc: "DMA last signals to expansion" }

  # =============================================================================
  # Module Instances
  # =============================================================================
  instances:
    # --- NanoSoC Core ---
    - instance_name: u_nanosoc
      module: nanosoc
      addressable: False
      params:
        SYS_ADDR_W: $SYS_ADDR_W
        SYS_DATA_W: $SYS_DATA_W
        APB_ADDR_W: $APB_ADDR_W
        APB_DATA_W: $APB_DATA_W
        BOOTROM_ADDR_W: $BOOTROM_ADDR_W
        IMEM_RAM_ADDR_W: $IMEM_RAM_ADDR_W
        IMEM_RAM_DATA_W: $IMEM_RAM_DATA_W
        IMEM_MEM_FPGA_IMG: $IMEM_MEM_FPGA_IMG
        DMEM_RAM_ADDR_W: $DMEM_RAM_ADDR_W
        DMEM_RAM_DATA_W: $DMEM_RAM_DATA_W
        SRAM_0_RAM_ADDR_W: $SRAM_0_RAM_ADDR_W
        SRAM_0_RAM_DATA_W: $SRAM_0_RAM_DATA_W
        SRAM_1_RAM_ADDR_W: $SRAM_1_RAM_ADDR_W
        SRAM_1_RAM_DATA_W: $SRAM_1_RAM_DATA_W
        CLKGATE_PRESENT: $CLKGATE_PRESENT
        BE: $BE
        BKPT: $BKPT
        DBG: $DBG
        NUMIRQ: $NUMIRQ
        SMUL: $SMUL
        SYST: $SYST
        WIC: $WIC
        WICLINES: $WICLINES
        WPT: $WPT
        RESET_ALL_REGS: $RESET_ALL_REGS
        INCLUDE_JTAG: $INCLUDE_JTAG
        DMAC_0_TYPE: $DMAC_0_TYPE
        DMAC_1_TYPE: $DMAC_1_TYPE
        DMAC_0_CHANNEL_NUM: $DMAC_0_CHANNEL_NUM
        DMAC_1_CHANNEL_NUM: $DMAC_1_CHANNEL_NUM
        PROMPT_CHAR: $PROMPT_CHAR
        FT1248_WIDTH: $FT1248_WIDTH
        FT1248_CLKON: $FT1248_CLKON
        FT1248_CLKDIV: $FT1248_CLKDIV
        SYSTABLE_BASE: $SYSTABLE_BASE
        SOCLABS_JEPID: $SOCLABS_JEPID
        NANOSOC_PARTNUMBER: $NANOSOC_PARTNUMBER
        NANOSOC_REVISION: $NANOSOC_REVISION
        QSPI_FLASH_PRESENT: $QSPI_FLASH_PRESENT
        QSPI_ADDR_W: $QSPI_ADDR_W
      connections:
        # Clocks and Resets
        - { port: sys_clk,         conn: SYS_CLK }
        - { port: sys_sysresetn,   conn: SYS_SYSRESETn }
        - { port: sys_xtalclk_out, conn: SYS_XTALCLK_OUT }
        # Scan
        - { port: sys_scanenable,  conn: SYS_SCANENABLE }
        - { port: sys_testmode,    conn: SYS_TESTMODE }
        - { port: sys_scaninhclk,  conn: SYS_SCANINHCLK }
        - { port: sys_scanouthclk, conn: SYS_SCANOUTHCLK }
        # Serial Wire Debug
        - { port: cpu_0_swdi,      conn: CPU_0_SWDI }
        - { port: cpu_0_swclk,     conn: CPU_0_SWCLK }
        - { port: cpu_0_swdo,      conn: CPU_0_SWDO }
        - { port: cpu_0_swdoen,    conn: CPU_0_SWDOEN }
        # GPIO
        - { port: p0_in,           conn: P0_IN }
        - { port: p0_out,          conn: P0_OUT }
        - { port: p0_outen,        conn: P0_OUTEN }
        - { port: p1_in,           conn: P1_IN }
        - { port: p1_out,          conn: P1_OUT }
        - { port: p1_outen,        conn: P1_OUTEN }
        # Generated AHB clock and reset
        - { port: sys_hclk,        conn: SYS_HCLK }
        - { port: sys_hresetn,     conn: SYS_HRESETn }
        # Expansion Region AHB Port
        - { port: exp_hsel,        conn: EXP_HSEL }
        - { port: exp_haddr,       conn: EXP_HADDR }
        - { port: exp_htrans,      conn: EXP_HTRANS }
        - { port: exp_hsize,       conn: EXP_HSIZE }
        - { port: exp_hprot,       conn: EXP_HPROT }
        - { port: exp_hwrite,      conn: EXP_HWRITE }
        - { port: exp_hready,      conn: EXP_HREADY }
        - { port: exp_hwdata,      conn: EXP_HWDATA }
        - { port: exp_hburst,      conn: EXP_HBURST }
        - { port: exp_hmastlock,   conn: EXP_HMASTLOCK }
        - { port: exp_hreadyout,   conn: EXP_HREADYOUT }
        - { port: exp_hresp,       conn: EXP_HRESP }
        - { port: exp_hrdata,      conn: EXP_HRDATA }
        # DMA Stream 0
        - { port: exp_str_in_0_tvalid,  conn: EXP_STR_IN_0_TVALID }
        - { port: exp_str_in_0_tready,  conn: EXP_STR_IN_0_TREADY }
        - { port: exp_str_in_0_tdata,   conn: EXP_STR_IN_0_TDATA }
        - { port: exp_str_in_0_tstrb,   conn: EXP_STR_IN_0_TSTRB }
        - { port: exp_str_in_0_tlast,   conn: EXP_STR_IN_0_TLAST }
        - { port: exp_str_out_0_tvalid, conn: EXP_STR_OUT_0_TVALID }
        - { port: exp_str_out_0_tready, conn: EXP_STR_OUT_0_TREADY }
        - { port: exp_str_out_0_tdata,  conn: EXP_STR_OUT_0_TDATA }
        - { port: exp_str_out_0_tstrb,  conn: EXP_STR_OUT_0_TSTRB }
        - { port: exp_str_out_0_tlast,  conn: EXP_STR_OUT_0_TLAST }
        - { port: exp_str_out_0_flush,  conn: EXP_STR_OUT_0_FLUSH }
        # DMA Stream 1
        - { port: exp_str_in_1_tvalid,  conn: EXP_STR_IN_1_TVALID }
        - { port: exp_str_in_1_tready,  conn: EXP_STR_IN_1_TREADY }
        - { port: exp_str_in_1_tdata,   conn: EXP_STR_IN_1_TDATA }
        - { port: exp_str_in_1_tstrb,   conn: EXP_STR_IN_1_TSTRB }
        - { port: exp_str_in_1_tlast,   conn: EXP_STR_IN_1_TLAST }
        - { port: exp_str_out_1_tvalid, conn: EXP_STR_OUT_1_TVALID }
        - { port: exp_str_out_1_tready, conn: EXP_STR_OUT_1_TREADY }
        - { port: exp_str_out_1_tdata,  conn: EXP_STR_OUT_1_TDATA }
        - { port: exp_str_out_1_tstrb,  conn: EXP_STR_OUT_1_TSTRB }
        - { port: exp_str_out_1_tlast,  conn: EXP_STR_OUT_1_TLAST }
        - { port: exp_str_out_1_flush,  conn: EXP_STR_OUT_1_FLUSH }
        # DMA Stream 2
        - { port: exp_str_in_2_tvalid,  conn: EXP_STR_IN_2_TVALID }
        - { port: exp_str_in_2_tready,  conn: EXP_STR_IN_2_TREADY }
        - { port: exp_str_in_2_tdata,   conn: EXP_STR_IN_2_TDATA }
        - { port: exp_str_in_2_tstrb,   conn: EXP_STR_IN_2_TSTRB }
        - { port: exp_str_in_2_tlast,   conn: EXP_STR_IN_2_TLAST }
        - { port: exp_str_out_2_tvalid, conn: EXP_STR_OUT_2_TVALID }
        - { port: exp_str_out_2_tready, conn: EXP_STR_OUT_2_TREADY }
        - { port: exp_str_out_2_tdata,  conn: EXP_STR_OUT_2_TDATA }
        - { port: exp_str_out_2_tstrb,  conn: EXP_STR_OUT_2_TSTRB }
        - { port: exp_str_out_2_tlast,  conn: EXP_STR_OUT_2_TLAST }
        - { port: exp_str_out_2_flush,  conn: EXP_STR_OUT_2_FLUSH }
        # Expansion Interrupt and DMA Connections
        - { port: exp_irq,         conn: EXP_IRQ }
        - { port: exp_drq,         conn: EXP_DRQ }
        - { port: exp_dlast,       conn: EXP_DLAST }
        # QSPI Flash pads (active when QSPI_FLASH_PRESENT > 0)
        - { port: qspi_sclk,      conn: QSPI_SCLK,  condition: "$QSPI_FLASH_PRESENT > 0" }
        - { port: qspi_csn,       conn: QSPI_CSN,   condition: "$QSPI_FLASH_PRESENT > 0" }
        - { port: qspi_io_o,      conn: QSPI_IO_O,  condition: "$QSPI_FLASH_PRESENT > 0" }
        - { port: qspi_io_i,      conn: QSPI_IO_I,  condition: "$QSPI_FLASH_PRESENT > 0" }
        - { port: qspi_io_oe,     conn: QSPI_IO_OE, condition: "$QSPI_FLASH_PRESENT > 0" }

    # --- Expansion Region ---
    # USER: Replace this default expansion region with your own accelerator IP.
    # The default region instantiates cmsdk_ahb_default_slave which returns
    # AHB error responses. Remove this instance and add your accelerator
    # subsystem with the same AHB/AXI-Stream/IRQ/DMA interface.
    - instance_name: u_region_exp
      module: nanosoc_region_exp_default
      addressable: False
      params:
        SYS_ADDR_W: $SYS_ADDR_W
        SYS_DATA_W: $SYS_DATA_W
        ACCELERATOR_SUBSYSTEM: $ACCELERATOR_SUBSYSTEM
      connections:
        - { port: HCLK,                  conn: SYS_HCLK }
        - { port: HRESETn,               conn: SYS_HRESETn }
        # AHB Subordinate Port
        - { port: HSEL,                  conn: EXP_HSEL }
        - { port: HADDR,                 conn: EXP_HADDR }
        - { port: HTRANS,                conn: EXP_HTRANS }
        - { port: HSIZE,                 conn: EXP_HSIZE }
        - { port: HPROT,                 conn: EXP_HPROT }
        - { port: HWRITE,                conn: EXP_HWRITE }
        - { port: HREADY,                conn: EXP_HREADY }
        - { port: HWDATA,                conn: EXP_HWDATA }
        - { port: HREADYOUT,             conn: EXP_HREADYOUT }
        - { port: HRESP,                 conn: EXP_HRESP }
        - { port: HRDATA,                conn: EXP_HRDATA }
        # DMA Stream 0
        - { port: EXP_STR_IN_0_TVALID,   conn: EXP_STR_IN_0_TVALID }
        - { port: EXP_STR_IN_0_TREADY,   conn: EXP_STR_IN_0_TREADY }
