# Identical interface to nanosoc_region_bootrom, but a DISTINCT module name so a
# two-core SoC (M0+ manager + M4 compute) can carry two separate boot ROMs
# without a module/cell clash. The manager keeps nanosoc_region_bootrom (->
# nanosoc_bootrom_cpu_0); compute_ss uses this (-> compute_ss_bootrom). The RTL
# wrapper + ROM core are generated per-image by bootrom_gen.py.
# Derived from RTL: compute-subsystem/src/rtl/bootrom/compute_ss_region_bootrom.v

module:
  name: compute_ss_region_bootrom
  gen: False
  desc: >
    Boot ROM region for the M4 compute subsystem. Read-only memory containing
    boot code. Has no reset port (HCLK only). Instantiates compute_ss_bootrom
    internally. Address bits [ROM_ADDR_W-1:0] are extracted from HADDR for
    memory access. Distinct module name from nanosoc_region_bootrom so the
    manager (M0+) and compute (M4) boot ROMs do not collide at the top level.

  params:
    SYS_ADDR_W: { type: int, default: 32, desc: "System address width" }
    SYS_DATA_W: { type: int, default: 32, desc: "System data width" }
    ROM_ADDR_W: { type: int, default: 11, desc: "Boot ROM address width (phys = 2^N bytes, default 2 KB)" }

  interfaces:
    # Clock (no reset — ROM content is fixed)
    - { name: HCLK, type: wire, direction: in, params: { WIDTH: 1 }, desc: AHB clock }

    # AHB slave port
    - { name: ahb_slave, type: ahb, direction: target, params: { ADDR_WIDTH: $SYS_ADDR_W, DATA_WIDTH: $SYS_DATA_W, EXCLUDE: [hburst, hmastlock] }, desc: AHB slave port for boot ROM access }
