# Derived from RTL: nanosoc_arch_tech/rtl/src/regions/dmem/nanosoc_region_dmem.v

module:
  name: nanosoc_region_dmem
  gen: False
  desc: >
    Data memory region. SRAM only (no preload option). Generic and reusable —
    instance numbering is at the instantiation site, not in the module name.

  params:
    SYS_ADDR_W: { type: int, default: 32, desc: "System address width" }
    SYS_DATA_W: { type: int, default: 32, desc: "System data width" }
    RAM_ADDR_W: { type: int, default: 14, desc: "RAM address width (phys = 4 * 2^N bytes, default 64 KB)" }
    RAM_DATA_W: { type: int, default: 32, desc: "RAM data width" }

  interfaces:
    # Clock and Reset
    - { name: HCLK,    type: wire, direction: in, params: { WIDTH: 1 }, desc: AHB clock }
    - { name: HRESETn, type: wire, direction: in, params: { WIDTH: 1 }, desc: AHB reset (active low) }

    # AHB slave port
    - { name: ahb_slave, type: ahb, direction: target, params: { ADDR_WIDTH: $SYS_ADDR_W, DATA_WIDTH: $SYS_DATA_W, EXCLUDE: [hburst, hmastlock] }, desc: AHB slave port for data memory access }

  srams:
    - { name: u_sram, addr_width: $RAM_ADDR_W, data_width: $RAM_DATA_W, desc: "Data memory SRAM (sl_ahb_sram)" }
