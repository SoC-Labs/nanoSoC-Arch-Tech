# Derived from RTL: rtl/src/regions/reset_ctrl/nanosoc_reset_ctrl.v
#
# A single AHB-Lite slave that is both a register block AND a per-core reset
# generator for the dual-core (CPU0 / CPU1) NanoSoC. It aggregates the per-core
# reset sources (SYSRESETREQ, lockup, watchdog, software reset, external reset),
# stretches each request into an N-cycle FCLK pulse, captures the reset cause in
# W1C RESET_INFO registers, and drives the active-low per-core resets. The CPU1
# boot-gate is folded into cpu1_resetn so that bootgate=0 holds CPU1 in reset.

module:
  name: nanosoc_reset_ctrl
  gen: False
  desc: >
    Per-core reset controller and register block for the dual-core NanoSoC.
    Aggregates SYSRESETREQ / lockup / watchdog / software / external reset
    sources per core, stretches them into N-cycle FCLK pulses, latches the
    reset cause in W1C RESET_INFO registers, and emits active-low core resets
    (cpu0_resetn, cpu1_resetn). The CPU1 boot-gate is folded into cpu1_resetn.

  params:
    SYS_ADDR_W:    { type: int, default: 32, desc: "System address width" }
    SYS_DATA_W:    { type: int, default: 32, desc: "System data width" }
    RESET_STRETCH: { type: int, default: 8,  desc: "Active-high reset pulse length in FCLK cycles" }

  interfaces:
    # Clocks and Resets
    - { name: HCLK,     type: wire, direction: in, params: { WIDTH: 1 }, desc: "AHB system bus clock" }
    - { name: HRESETn,  type: wire, direction: in, params: { WIDTH: 1 }, desc: "AHB system bus reset (active low)" }
    - { name: FCLK,     type: wire, direction: in, params: { WIDTH: 1 }, desc: "Free-running clock (stretch/capture)" }
    - { name: PORESETn, type: wire, direction: in, params: { WIDTH: 1 }, desc: "Power-on reset (active low)" }

    # AHB slave port (register block)
    - { name: ahb_slave, type: ahb, direction: target, params: { ADDR_WIDTH: $SYS_ADDR_W, DATA_WIDTH: $SYS_DATA_W }, desc: "AHB slave port — reset controller register block" }

    # Sideband reset-source inputs (active-high level/pulse)
    - { name: cpu0_sysresetreq,  type: wire, direction: in, params: { WIDTH: 1 }, desc: "CPU0 system reset request (SYSRESETREQ)" }
    - { name: cpu1_sysresetreq,  type: wire, direction: in, params: { WIDTH: 1 }, desc: "CPU1 system reset request (SYSRESETREQ)" }
    - { name: cpu1_wdogresetreq, type: wire, direction: in, params: { WIDTH: 1 }, desc: "CPU1 watchdog reset request" }
    - { name: cpu0_lockup,       type: wire, direction: in, params: { WIDTH: 1 }, desc: "CPU0 lockup indication" }
    - { name: cpu1_lockup,       type: wire, direction: in, params: { WIDTH: 1 }, desc: "CPU1 lockup indication" }
    - { name: ext_sysresetreq,   type: wire, direction: in, params: { WIDTH: 1 }, desc: "External system reset request (resets both cores)" }
    - { name: cpu1_bootgate,     type: wire, direction: in, params: { WIDTH: 1 }, desc: "CPU1 boot-gate; 0 holds CPU1 in reset (legacy eth-releases-CPU1 path)" }
    - { name: cpu0_bootgate,     type: wire, direction: in, params: { WIDTH: 1 }, desc: "CPU0 boot-gate; 0 holds CPU0/eth in reset (CPU1-chip-control inversion: CPU1 releases CPU0)" }

    # Per-core reset outputs (active-low)
    - { name: cpu0_resetn, type: wire, direction: out, params: { WIDTH: 1 }, desc: "CPU0 reset (active low)" }
    - { name: cpu1_resetn, type: wire, direction: out, params: { WIDTH: 1 }, desc: "CPU1 reset (active low), boot-gate folded in" }

  register_map: ../../register_maps/nanosoc_reset_ctrl.yaml
