# Derived from RTL: nanosoc_arch_tech/rtl/src/regions/soc_peripheral/nanosoc_region_soc_peripheral.v
# Note: This region is instantiated inside nanosoc_ss_systemctrl, not directly in nanosoc.sv.

module:
  name: nanosoc_region_soc_peripheral
  gen: False
  desc: >
    SoC peripheral region containing AHB slave mux (cmsdk_ahb_slave_mux, 4 slots)
    with an AHB-to-APB bridge (cmsdk_ahb_to_apb) feeding an APB slave mux
    (16 slots). Contains timers, UARTs, watchdog, GPIO, system controller,
    and ADC. The two-level address decode hierarchy is internal to this module.

  params:
    SYS_ADDR_W: { type: int, default: 32, desc: "System address width" }
    SYS_DATA_W: { type: int, default: 32, desc: "System data width" }
    APB_ADDR_W: { type: int, default: 12, desc: "APB peripheral address width" }
    APB_DATA_W: { type: int, default: 32, desc: "APB peripheral data width" }

  interfaces:
    # Clock and Reset
    - { name: HCLK,    type: wire, direction: in, params: { WIDTH: 1 }, desc: AHB clock }
    - { name: HRESETn, type: wire, direction: in, params: { WIDTH: 1 }, desc: AHB reset (active low) }
    - { name: PCLK,    type: wire, direction: in, params: { WIDTH: 1 }, desc: APB clock }
    - { name: PCLKG,   type: wire, direction: in, params: { WIDTH: 1 }, desc: Gated APB clock }
    - { name: PRESETn, type: wire, direction: in, params: { WIDTH: 1 }, desc: APB reset (active low) }
    - { name: PCLKEN,  type: wire, direction: in, params: { WIDTH: 1 }, desc: APB clock enable }

    # AHB slave port
    - { name: ahb_slave, type: ahb, direction: target, params: { ADDR_WIDTH: $SYS_ADDR_W, DATA_WIDTH: $SYS_DATA_W }, desc: AHB slave port for peripheral region }

    # APB extension ports (directly wired for external APB slaves)
    - { name: SOC_PERIPHERAL_PENABLE, type: wire, direction: out, params: { WIDTH: 1 },          desc: APB enable passthrough }
    - { name: SOC_PERIPHERAL_PWRITE,  type: wire, direction: out, params: { WIDTH: 1 },          desc: APB write passthrough }
    - { name: SOC_PERIPHERAL_PADDR,   type: wire, direction: out, params: { WIDTH: $APB_ADDR_W }, desc: APB address passthrough }
    - { name: SOC_PERIPHERAL_PWDATA,  type: wire, direction: out, params: { WIDTH: $APB_DATA_W }, desc: APB write data passthrough }

    # APB extension slot 14 (USRT) — directly connected to debug subsystem
    - { name: USRT_PSEL,    type: wire, direction: out, params: { WIDTH: 1 },          desc: APB select for USRT (extension port 14) }
    - { name: USRT_PRDATA,  type: wire, direction: in,  params: { WIDTH: $APB_DATA_W }, desc: APB read data from USRT }
    - { name: USRT_PREADY,  type: wire, direction: in,  params: { WIDTH: 1 },          desc: APB ready from USRT }
    - { name: USRT_PSLVERR, type: wire, direction: in,  params: { WIDTH: 1 },          desc: APB slave error from USRT }

    # Interrupt outputs
    - { name: SYS_NMI,        type: wire, direction: out, params: { WIDTH: 1 },  desc: Non-maskable interrupt (from watchdog) }
    - { name: SYS_APB_IRQ,    type: wire, direction: out, params: { WIDTH: 32 }, desc: APB subsystem interrupt vector }
    - { name: SYS_GPIO0_IRQ,  type: wire, direction: out, params: { WIDTH: 16 }, desc: GPIO port 0 individual interrupts }
    - { name: SYS_GPIO1_IRQ,  type: wire, direction: out, params: { WIDTH: 16 }, desc: GPIO port 1 individual interrupts }

    # System control outputs
    - { name: SYS_REMAP_CTRL,    type: wire, direction: out, params: { WIDTH: 1 }, desc: Memory remap control (active high disables remap) }
    - { name: SYS_WDOGRESETREQ,  type: wire, direction: out, params: { WIDTH: 1 }, desc: Watchdog reset request }
    - { name: SYS_LOCKUPRESET,   type: wire, direction: out, params: { WIDTH: 1 }, desc: Reset on CPU lockup configuration }
    - { name: SYS_PMUENABLE,     type: wire, direction: out, params: { WIDTH: 1 }, desc: Power management unit enable }

    # CPU status inputs
    - { name: CPU_SYSRESETREQ,   type: wire, direction: in, params: { WIDTH: 1 }, desc: CPU system reset request }
    - { name: CPU_PRMURESETREQ,  type: wire, direction: in, params: { WIDTH: 1 }, desc: CPU PRMU reset request }
    - { name: SYS_PMUDBGRESETREQ, type: wire, direction: in, params: { WIDTH: 1 }, desc: PMU debug reset request }
    - { name: CPU_LOCKUP,        type: wire, direction: in, params: { WIDTH: 1 }, desc: CPU lockup status }
    - { name: CPU_SLEEPING,      type: wire, direction: in, params: { WIDTH: 1 }, desc: CPU sleeping status }
    - { name: CPU_SLEEPDEEP,     type: wire, direction: in, params: { WIDTH: 1 }, desc: CPU deep sleep status }

    # USRT byte streams (to/from debug subsystem via external routing)
    - { name: USRT0_TXD, type: axis_byte, direction: out, params: {}, desc: "USRT0 transmit byte stream" }
    - { name: USRT0_RXD, type: axis_byte, direction: in,  params: {}, desc: "USRT0 receive byte stream" }
    - { name: USRT1_TXD, type: axis_byte, direction: out, params: {}, desc: "USRT1 transmit byte stream" }
    - { name: USRT1_RXD, type: axis_byte, direction: in,  params: {}, desc: "USRT1 receive byte stream" }

    # GPIO ports
    - { name: P0, type: gpio, direction: inout, params: { WIDTH: 16 }, desc: "GPIO port 0 (16 pins)" }
    - { name: P1, type: gpio, direction: inout, params: { WIDTH: 16 }, desc: "GPIO port 1 (16 pins, with FTDI/EXTIO pin muxing)" }
    - { name: P1_OUT_MUX,    type: wire, direction: out, params: { WIDTH: 16 }, desc: "GPIO port 1 output mux (after pin muxing)" }
    - { name: P1_OUT_EN_MUX, type: wire, direction: out, params: { WIDTH: 16 }, desc: "GPIO port 1 output enable mux (after pin muxing)" }

  # =============================================================================
  # Internal Address Decode (addresses shortcomings #4, #5)
  # =============================================================================
  # Two-level address decode: AHB slave mux → APB slave mux via AHB-to-APB bridge
  address_decode:
    type: ahb_slave_mux
    module: cmsdk_ahb_slave_mux

    slots:
      # Slot 0: APB subsystem (via AHB-to-APB bridge)
      - slot: 0
        name: apb_ss
        offset: 0x00000000
        size: 0x00010000
        address_decode:
          type: apb_slave_mux
          module: cmsdk_apb_slave_mux
          bridge:
            type: cmsdk_ahb_to_apb
            params: { ADDRWIDTH: 16, REGISTER_RDATA: 1 }
          slots:
            - { slot: 0,  name: timer_0,      module: cmsdk_apb_timer,        offset: 0x0000, size: 0x1000, register_map: register_maps/cmsdk_apb_timer.yaml }
            - { slot: 1,  name: timer_1,      module: cmsdk_apb_timer,        offset: 0x1000, size: 0x1000, register_map: register_maps/cmsdk_apb_timer.yaml }
            - { slot: 2,  name: dualtimer_2,  module: cmsdk_apb_dualtimers,   offset: 0x2000, size: 0x1000, register_map: register_maps/cmsdk_apb_dualtimers.yaml }
            - { slot: 4,  name: uart_0,       module: socdebug_usrt_control,  offset: 0x4000, size: 0x1000, register_map: register_maps/socdebug_usrt.yaml }
            - { slot: 5,  name: uart_1,       module: socdebug_usrt_control,  offset: 0x5000, size: 0x1000, register_map: register_maps/socdebug_usrt.yaml }
            - { slot: 6,  name: uart_2,       module: cmsdk_apb_uart,         offset: 0x6000, size: 0x1000, register_map: register_maps/cmsdk_apb_uart.yaml }
            - { slot: 8,  name: watchdog,     module: cmsdk_apb_watchdog,     offset: 0x8000, size: 0x1000, register_map: register_maps/cmsdk_apb_watchdog.yaml }
            - { slot: 11, name: test_slave,   module: cmsdk_apb_slave,        offset: 0xB000, size: 0x1000, register_map: register_maps/cmsdk_apb_test_slave.yaml }
            # Slots 12-15: APB extension ports (directly wired to module ports)
            - { slot: 12, name: ext_port_12,  module: external, offset: 0xC000, size: 0x1000, desc: "APB extension port 12" }
            - { slot: 13, name: discovery,     module: nanosoc_ahb_interconnect_discovery_table, offset: 0xD000, size: 0x1000, register_map: ../../build_soc/discovery/nanosoc_ahb_interconnect_discovery.yaml, desc: "Auto-generated bus topology discovery table" }
            - { slot: 14, name: ext_port_14,  module: external, offset: 0xE000, size: 0x1000, desc: "APB extension port 14 (USRT debug)" }
            - { slot: 15, name: ext_port_15,  module: external, offset: 0xF000, size: 0x1000, desc: "APB extension port 15" }

      # Slot 1: GPIO port 0
      - slot: 1
        name: gpio_0
        module: cmsdk_ahb_gpio
        offset: 0x00010000
        size: 0x00001000
        register_map: register_maps/cmsdk_ahb_gpio.yaml

      # Slot 2: GPIO port 1
      - slot: 2
        name: gpio_1
        module: cmsdk_ahb_gpio
        offset: 0x00011000
        size: 0x00001000
        register_map: register_maps/cmsdk_ahb_gpio.yaml

      # Slot 3: System controller
      - slot: 3
        name: sysctrl
        module: nanosoc_sysctrl
        offset: 0x0001F000
        size: 0x00001000
        register_map: register_maps/nanosoc_sysctrl.yaml
