register_map:
  name: coresight_rom_table
  module: nanosoc_coresight_systable
  description: >
    CoreSight system ROM table. Contains up to 4 entries pointing to debug
    components. Each entry is a signed 12-bit offset from the ROM table base
    address (bits [31:12]), with bit 0 indicating entry present. PID/CID
    registers provide JEDEC manufacturer ID, part number, and component class.
  address_width: 12
  data_width: 32

  registers:
    - name: ENTRY0
      offset: 0x000
      width: 32
      access: RO
      description: >
        ROM table entry 0. Bits [31:12] = signed offset to component.
        Bit [1] = format (1=32-bit). Bit [0] = present.

    - name: ENTRY1
      offset: 0x004
      width: 32
      access: RO
      description: ROM table entry 1

    - name: ENTRY2
      offset: 0x008
      width: 32
      access: RO
      description: ROM table entry 2

    - name: ENTRY3
      offset: 0x00C
      width: 32
      access: RO
      description: ROM table entry 3

    - name: PID4
      offset: 0xFD0
      width: 32
      access: RO
      description: Peripheral ID 4 (JEP106 continuation count)
      fields:
        - name: JEP106_CC
          bits: "3:0"
          access: RO
          description: JEP106 continuation code count

    - name: PID0
      offset: 0xFE0
      width: 32
      access: RO
      description: Peripheral ID 0
      fields:
        - name: PART_NUMBER_LO
          bits: "7:0"
          access: RO
          description: Part number [7:0]

    - name: PID1
      offset: 0xFE4
      width: 32
      access: RO
      description: Peripheral ID 1
      fields:
        - name: JEP106_LO
          bits: "7:4"
          access: RO
          description: JEP106 identity code [3:0]
        - name: PART_NUMBER_HI
          bits: "3:0"
          access: RO
          description: Part number [11:8]

    - name: PID2
      offset: 0xFE8
      width: 32
      access: RO
      description: Peripheral ID 2
      fields:
        - name: REVISION
          bits: "7:4"
          access: RO
          description: Component revision
        - name: JEDEC_USED
          bits: "3"
          access: RO
          description: JEDEC assigned manufacturer (1 = yes)
        - name: JEP106_HI
          bits: "2:0"
          access: RO
          description: JEP106 identity code [6:4]

    - name: PID3
      offset: 0xFEC
      width: 32
      access: RO
      description: Peripheral ID 3
      fields:
        - name: ECOREVNUM
          bits: "7:4"
          access: RO
          description: Engineering change order revision number
        - name: CMOD
          bits: "3:0"
          access: RO
          description: Customer modified

    - name: CID0
      offset: 0xFF0
      width: 32
      access: RO
      description: Component ID 0 (preamble byte 0x0D)

    - name: CID1
      offset: 0xFF4
      width: 32
      access: RO
      description: Component ID 1 (component class = ROM table)
      fields:
        - name: CLASS
          bits: "7:4"
          access: RO
          description: "Component class (0x1 = ROM table)"
        - name: PREAMBLE
          bits: "3:0"
          access: RO
          description: Preamble (0x0)

    - name: CID2
      offset: 0xFF8
      width: 32
      access: RO
      description: Component ID 2 (preamble byte 0x05)

    - name: CID3
      offset: 0xFFC
      width: 32
      access: RO
      description: Component ID 3 (preamble byte 0xB1)
