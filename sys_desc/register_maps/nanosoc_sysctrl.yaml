register_map:
  name: nanosoc_sysctrl
  module: nanosoc_sysctrl
  gen: False
  description: >
    System controller providing memory remap control, PMU enable, lockup reset
    configuration, and reset information tracking. Controls the IMEM/bootrom
    remap at address 0x00000000.
  address_width: 12
  data_width: 32

  identification:
    pid4: 0x04
    pid5: 0x00
    pid6: 0x00
    pid7: 0x00
    pid0: 0x26
    pid1: 0xB8
    pid2: 0x1B
    pid3: 0x00
    cid0: 0x0D
    cid1: 0xF0
    cid2: 0x05
    cid3: 0xB1

  registers:
    - name: REMAP_CTRL
      offset: 0x000
      width: 32
      access: RW
      reset_value: 0x00000001
      description: Memory remap control register
      fields:
        - name: REMAP
          bits: "3:0"
          access: RW
          reset_value: 0
          description: >
            Memory remap bit. Reset value 0 maps bootrom at 0x00000000.
            Write 1 to remap IMEM to 0x00000000 (overlay bootrom).

    - name: PMU_CTRL
      offset: 0x004
      width: 32
      access: RW
      reset_value: 0x00000000
      description: Power Management Unit control register
      fields:
        - name: PMUENABLE
          bits: "0"
          access: RW
          reset_value: 0
          description: PMU enable

    - name: SYS_CTRL
      offset: 0x008
      width: 32
      access: RW
      reset_value: 0x00000000
      description: System control register
      fields:
        - name: LOCKUPRESETEN
          bits: "0"
          access: RW
          reset_value: 0
          description: Enable automatic system reset when CPU enters lockup state

    - name: RESET_INFO
      offset: 0x010
      width: 32
      access: W1C
      reset_value: 0x00000000
      description: Reset information register (records cause of last reset; write 1 to clear)
      fields:
        - name: SYSRESETREQ
          bits: "0"
          access: W1C
          description: System reset request occurred (from CPU SYSRESETREQ)
        - name: WDOGRESETREQ
          bits: "1"
          access: W1C
          description: Watchdog reset request occurred
        - name: LOCKUPRESET
          bits: "2"
          access: W1C
          description: Lockup reset occurred (CPU lockup with LOCKUPRESETEN=1)

    - name: PID4
      offset: 0xFD0
      width: 32
      access: RO
      description: Peripheral ID 4

    - name: PID5
      offset: 0xFD4
      width: 32
      access: RO
      description: Peripheral ID 5

    - name: PID6
      offset: 0xFD8
      width: 32
      access: RO
      description: Peripheral ID 6

    - name: PID7
      offset: 0xFDC
      width: 32
      access: RO
      description: Peripheral ID 7

    - name: PID0
      offset: 0xFE0
      width: 32
      access: RO
      description: Peripheral ID 0

    - name: PID1
      offset: 0xFE4
      width: 32
      access: RO
      description: Peripheral ID 1

    - name: PID2
      offset: 0xFE8
      width: 32
      access: RO
      description: Peripheral ID 2

    - name: PID3
      offset: 0xFEC
      width: 32
      access: RO
      description: Peripheral ID 3 (includes ECOREVNUM in bits [7:4])

    - name: CID0
      offset: 0xFF0
      width: 32
      access: RO
      description: Component ID 0

    - name: CID1
      offset: 0xFF4
      width: 32
      access: RO
      description: Component ID 1

    - name: CID2
      offset: 0xFF8
      width: 32
      access: RO
      description: Component ID 2

    - name: CID3
      offset: 0xFFC
      width: 32
      access: RO
      description: Component ID 3
