# Derived from RTL: generated by nanosoc_gen.
#
# The "compute" subsystem that replaces the ethernet subsystem in the new
# M0+/M4 dual-core SoC. Houses the wrapped Cortex-M4 (slcorem4 -> single
# AHB-Lite master, v1), local boot ROM / IMEM / DMEM sized for Zephyr+FPU, and
# the internal 2-initiator x 4-target AHB busmatrix (identical structure to
# nanosoc_ss_cpu_plus: core `cpu_0` + admin `cpu_ss`).
#
# CLOCK/RESET CONSUMER: unlike nanosoc_ss_cpu(_plus) this subsystem does NOT
# generate sys_hclk/sys_hresetn (the M4 has no PRMU). It takes them as INPUTS,
# driven by the SoC manager core (CPU1 M0+). The external boundary otherwise
# mirrors a CPU subsystem (cpu_0 master + cpu_ss admin slave + sideband +
# cpu_0_dbgahb), so the SoC top wires it like the existing second-core socket.

module:
  name: compute_ss
  gen: True
  desc: >
    Cortex-M4 compute subsystem: wrapped M4 core (slcorem4, single AHB-Lite
    master) + local bootrom/IMEM/DMEM (Zephyr-sized) + internal AHB busmatrix
    with memory remap (sys_remap_ctrl[0]). Clock/reset consumer (driven by the
    manager core). FPU+MPU on; trace/ETM off (TRACE_LVL=1).

  params:
    SYS_ADDR_W:      { type: int, default: 32,         desc: "System address width" }
    SYS_DATA_W:      { type: int, default: 32,         desc: "System data width" }
    # Cortex-M4 config (passed to slcorem4). FPU+MPU on for Zephyr.
    FPU_PRESENT:     { type: int, default: 1,          desc: "Include the FPU" }
    MPU_PRESENT:     { type: int, default: 1,          desc: "Include the MPU" }
    NUM_IRQ:         { type: int, default: 64,         desc: "NVIC external IRQ lines" }
    LVL_WIDTH:       { type: int, default: 4,          desc: "Interrupt priority bits" }
    TRACE_LVL:       { type: int, default: 1,          desc: "Trace level (1=ITM/DWT, no ETM)" }
    DEBUG_LVL:       { type: int, default: 3,          desc: "Debug level" }
    WIC_PRESENT:     { type: int, default: 0,          desc: "Wake-up interrupt controller" }
    BB_PRESENT:      { type: int, default: 1,          desc: "Bit-banding" }
    CLKGATE_PRESENT: { type: int, default: 0,          desc: "Architectural clock gating" }
    RESET_ALL_REGS:  { type: int, default: 0,          desc: "Reset all registers" }
    BE:              { type: int, default: 0,          desc: "Endianness: 0=little, 1=big" }
    # Local memory sizing. IMPORTANT: *_ADDR_W is a BYTE address width, so the
    # physical size is 2^N BYTES (it drives sl_ahb_sram HADDR[RAM_ADDR_W-1:0]).
    # The old "4 * 2^N" comments were WRONG: N=13 => 8 KB (not 32 KB), N=15 => 32 KB.
    # IMEM must be >=32 KB so a RAM-exec OS (Zephyr: image+bss+stack in the
    # 0x10001000 region, ~28 KB) fits — at N=13 the 14.6 KB image wrapped the 8 KB
    # RAM and clobbered the SPL. See docs/BOOT_ARCHITECTURE.md.
    BOOTROM_ADDR_W:  { type: int, default: 11,         desc: "Boot ROM address width (phys = 2^N bytes = 2 KB)" }
    IMEM_RAM_ADDR_W: { type: int, default: 15,         desc: "IMEM address width (phys = 2^N bytes = 32 KB)" }
    IMEM_RAM_DATA_W: { type: int, default: 32,         desc: "IMEM data width" }
    IMEM_MEM_FPGA_IMG: { type: str, default: "image.hex", desc: "FPGA image to preload into IMEM" }
    DMEM_RAM_ADDR_W: { type: int, default: 15,         desc: "DMEM address width (phys = 2^N bytes = 32 KB)" }
    DMEM_RAM_DATA_W: { type: int, default: 32,         desc: "DMEM data width" }

  interfaces:
    # Clock and Reset INPUTS (consumer — from the SoC manager PRMU)
    - { name: sys_fclk,       type: wire, direction: in, params: { WIDTH: 1 }, desc: "Free-running clock input" }
    - { name: sys_hclk,       type: wire, direction: in, params: { WIDTH: 1 }, desc: "AHB clock input (from manager PRMU)" }
    - { name: sys_poresetn,   type: wire, direction: in, params: { WIDTH: 1 }, desc: "Power-on reset input (active low)" }
    - { name: sys_hresetn,    type: wire, direction: in, params: { WIDTH: 1 }, desc: "AHB reset input (active low)" }
    - { name: sys_sysresetn,  type: wire, direction: in, params: { WIDTH: 1 }, desc: "System reset input (active low)" }
    - { name: sys_scanenable, type: wire, direction: in, params: { WIDTH: 1 }, desc: "Scan mode enable" }
    - { name: sys_testmode,   type: wire, direction: in, params: { WIDTH: 1 }, desc: "Test mode enable" }

    # Memory remap control
    - { name: sys_remap_ctrl, type: wire, direction: in, params: { WIDTH: 4 }, desc: "Address remap control (bit 0 controls IMEM/bootrom overlay)" }

    # AHB master port — system traffic out (addresses >= 0x20000000)
    - { name: cpu_0, type: ahb, direction: initiator, params: { ADDR_WIDTH: 32, DATA_WIDTH: 32 }, desc: "Compute AHB master port (system passthrough)" }

    # AHB slave port — debug/DMA-boot access to local memories
    - { name: cpu_ss, type: ahb, direction: target, params: { ADDR_WIDTH: 32, DATA_WIDTH: 32, EXCLUDE: [hready] }, desc: "Compute subsystem AHB slave port (DMA-boot into bootrom/imem/dmem)" }

    # CPU sideband
    - { name: cpu_0_nmi,         type: wire, direction: in,  params: { WIDTH: 1 },        desc: "Non-maskable interrupt" }
    - { name: cpu_0_irq,         type: wire, direction: in,  params: { WIDTH: $NUM_IRQ }, desc: "NVIC maskable interrupt requests" }
    - { name: cpu_0_txev,        type: wire, direction: out, params: { WIDTH: 1 },        desc: "Send event (SEV) output" }
    - { name: cpu_0_rxev,        type: wire, direction: in,  params: { WIDTH: 1 },        desc: "Receive event input" }
    - { name: cpu_0_lockup,      type: wire, direction: out, params: { WIDTH: 1 },        desc: "CPU lockup status" }
    - { name: cpu_0_sysresetreq, type: wire, direction: out, params: { WIDTH: 1 },        desc: "CPU system reset request" }
    - { name: cpu_0_sleeping,    type: wire, direction: out, params: { WIDTH: 1 },        desc: "CPU sleeping status" }
    - { name: cpu_0_sleepdeep,   type: wire, direction: out, params: { WIDTH: 1 },        desc: "CPU deep sleep status" }
    - { name: cpu_0_fpu_flags,   type: wire, direction: out, params: { WIDTH: 6 },        desc: "FPU cumulative exception flags" }

    # Debug AHB-AP slave bus (driven by the SoC CoreSight DAP via a matrix bridge)
    - { name: cpu_0_dbgahb, type: dbg_ahb, direction: receiver, params: {}, desc: "Cortex-M4 debug-slave bus (wrapper-normalised; driven by system DAP)" }

  # Internal instances
  instances:
    - instance_name: u_cpu_0
      module: slcorem4
      addressable: False
      params: { FPU_PRESENT: $FPU_PRESENT, MPU_PRESENT: $MPU_PRESENT, NUM_IRQ: $NUM_IRQ, LVL_WIDTH: $LVL_WIDTH, TRACE_LVL: $TRACE_LVL, DEBUG_LVL: $DEBUG_LVL, WIC_PRESENT: $WIC_PRESENT, BB_PRESENT: $BB_PRESENT, CLKGATE_PRESENT: $CLKGATE_PRESENT, RESET_ALL_REGS: $RESET_ALL_REGS, BE: $BE }
      connections:
        # Three AHB masters (I/D/S) — arbitrated by the internal busmatrix
        - { port: mst_i, conn: nanosoc_compute_ss_ahb_interconnect.cpu_0_i }
        - { port: mst_d, conn: nanosoc_compute_ss_ahb_interconnect.cpu_0_d }
        - { port: mst_s, conn: nanosoc_compute_ss_ahb_interconnect.cpu_0_s }
        # Clock and Reset (consumed)
        - { port: SYS_FCLK,       conn: sys_fclk }
        - { port: SYS_HCLK,       conn: sys_hclk }
        - { port: SYS_PORESETn,   conn: sys_poresetn }
        - { port: SYS_HRESETn,    conn: sys_hresetn }
        - { port: SYS_SYSRESETn,  conn: sys_sysresetn }
        - { port: SYS_SCANENABLE, conn: sys_scanenable }
        - { port: SYS_TESTMODE,   conn: sys_testmode }
        # CPU sideband
        - { port: CORE_NMI,         conn: cpu_0_nmi }
        - { port: CORE_IRQ,         conn: cpu_0_irq }
        - { port: CORE_TXEV,        conn: cpu_0_txev }
        - { port: CORE_RXEV,        conn: cpu_0_rxev }
        - { port: CORE_LOCKUP,      conn: cpu_0_lockup }
        - { port: CORE_SYSRESETREQ, conn: cpu_0_sysresetreq }
        - { port: CORE_SLEEPING,    conn: cpu_0_sleeping }
        - { port: CORE_SLEEPDEEP,   conn: cpu_0_sleepdeep }
        - { port: CORE_FPU_FLAGS,   conn: cpu_0_fpu_flags }
        # Debug AHB-AP slave bus — driven by the system DAP via matrix bridge
        - { port: DBGAHB_SLVADDR,  conn: cpu_0_dbgahb_slvaddr }
        - { port: DBGAHB_SLVWDATA, conn: cpu_0_dbgahb_slvwdata }
        - { port: DBGAHB_SLVTRANS, conn: cpu_0_dbgahb_slvtrans }
        - { port: DBGAHB_SLVWRITE, conn: cpu_0_dbgahb_slvwrite }
        - { port: DBGAHB_SLVSIZE,  conn: cpu_0_dbgahb_slvsize }
        - { port: DBGAHB_SLVRDATA, conn: cpu_0_dbgahb_slvrdata }
        - { port: DBGAHB_SLVREADY, conn: cpu_0_dbgahb_slvready }
        - { port: DBGAHB_SLVRESP,  conn: cpu_0_dbgahb_slvresp }

    - instance_name: u_region_bootrom_0
      # Distinct module name from the M0+ manager's nanosoc_region_bootrom so a
      # two-core SoC carries two separate boot ROMs (M4 here, M0+ manager there)
      # without a module/cell clash.
      module: compute_ss_region_bootrom
      addressable: True
      params: { SYS_ADDR_W: $SYS_ADDR_W, SYS_DATA_W: $SYS_DATA_W, ROM_ADDR_W: $BOOTROM_ADDR_W }
      connections:
        - { port: HCLK,      conn: sys_hclk }
        - { port: ahb_slave, conn: nanosoc_compute_ss_ahb_interconnect.bootrom_0 }

    - instance_name: u_region_imem_0
      module: nanosoc_region_imem
      addressable: True
      params: { SYS_ADDR_W: $SYS_ADDR_W, SYS_DATA_W: $SYS_DATA_W, RAM_ADDR_W: $IMEM_RAM_ADDR_W, RAM_DATA_W: $IMEM_RAM_DATA_W, MEM_FPGA_IMG: $IMEM_MEM_FPGA_IMG }
      connections:
        - { port: HCLK,      conn: sys_hclk }
        - { port: HRESETn,   conn: sys_hresetn }
        - { port: ahb_slave, conn: nanosoc_compute_ss_ahb_interconnect.imem_0 }

    - instance_name: u_region_dmem_0
      module: nanosoc_region_dmem
      addressable: True
      params: { SYS_ADDR_W: $SYS_ADDR_W, SYS_DATA_W: $SYS_DATA_W, RAM_ADDR_W: $DMEM_RAM_ADDR_W, RAM_DATA_W: $DMEM_RAM_DATA_W }
      connections:
        - { port: HCLK,      conn: sys_hclk }
        - { port: HRESETn,   conn: sys_hresetn }
        - { port: ahb_slave, conn: nanosoc_compute_ss_ahb_interconnect.dmem_0 }

  # Internal busmatrix — 2 initiators x 4 targets (same structure as nanosoc_ss_cpu_plus)
  interconnects:
    - name: nanosoc_compute_ss_ahb_interconnect
      gen: True
      type: ahb_lite
      desc: >
        Compute subsystem internal busmatrix. Routes the M4 master and the
        external admin slave to local memories and the system passthrough.
        Memory remap via sys_remap_ctrl[0] (IMEM overlays bootrom at 0x0).

      connections:
        - { port: sys_hclk,        conn: sys_hclk }
        - { port: sys_hresetn,     conn: sys_hresetn }
        - { port: sys_scanenable,  conn: sys_scanenable }
        - { port: sys_scaninhclk,  conn: 1'b0 }
        - { port: sys_remap_ctrl,  conn: sys_remap_ctrl }

      targets:
        # phys_size MUST equal the physical RAM byte size = 2^ADDR_W (ADDR_W is a
        # BYTE address width driving sl_ahb_sram HADDR[ADDR_W-1:0]). The old
        # "4 * (2 ** N)" over-reported every RAM by 4x into the discovery-ROM size
        # descriptors + the generated linker MEMORY LENGTH, so a size-trusting
        # consumer would place data past the RAM end where it aliases back over
        # live code/data. See compute-subsystem/scripts/check_region_phys_size.py.
        - { name: bootrom_0, base: 0x00000000, size: 0x08000000, phys_size: "2 ** $BOOTROM_ADDR_W", sw_access: rx,  region_type: memory, role: bootrom, desc: "Boot ROM (alias at 0x00000000, default at 0x08000000)" }
        - { name: imem_0,    base: 0x10000000, size: 0x08000000, phys_size: "2 ** $IMEM_RAM_ADDR_W", sw_access: rwx, region_type: memory, role: None,    desc: "Instruction memory (remappable to 0x00000000)" }
        - { name: dmem_0,    base: 0x18000000, size: 0x08000000, phys_size: "2 ** $DMEM_RAM_ADDR_W", sw_access: rwx, region_type: memory, role: None,    desc: "Data memory" }
        - { name: system,    base: 0x20000000, size: 0xE0000000, sw_access: rw,  region_type: ~,      role: ~, passthrough: cpu_0, desc: "System passthrough to external AHB master port (cpu_0)" }

      initiators:
        # M4 I-Code (fetch): local code/data memories (0x0-0x1FFFFFFF). No system.
        - name: cpu_0_i
          targets:
            - name: bootrom_0
              visibility:
                - base: 0x00000000
                - base: 0x08000000
            - name: imem_0
              visibility:
                - base: 0x00000000
                  remap:
                    remapping: true
                    remap_behaviour: alias
                    remap_bit: 0
                - base: 0x10000000
            - name: dmem_0

        # M4 D-Code (data to 0x0-0x1FFFFFFF): same local memories. No system.
        - name: cpu_0_d
          targets:
            - name: bootrom_0
              visibility:
                - base: 0x00000000
                - base: 0x08000000
            - name: imem_0
              visibility:
                - base: 0x00000000
                  remap:
                    remapping: true
                    remap_behaviour: alias
                    remap_bit: 0
                - base: 0x10000000
            - name: dmem_0

        # M4 System (>= 0x20000000): system passthrough only.
        - name: cpu_0_s
          targets:
            - name: system

        - name: cpu_ss
          passthrough: cpu_ss
          targets:
            - name: bootrom_0
              visibility:
                - base: 0x00000000
                - base: 0x08000000
                - base: 0x80000000
            - name: imem_0
              visibility:
                - base: 0x00000000
                  remap:
                    remapping: true
                    remap_behaviour: alias
                    remap_bit: 0
                - base: 0x10000000
                - base: 0x90000000
            - name: dmem_0
              visibility:
                - base: 0x18000000
                - base: 0x98000000
            # Note: cpu_ss initiator cannot access 'system' target (prevents routing loops)
