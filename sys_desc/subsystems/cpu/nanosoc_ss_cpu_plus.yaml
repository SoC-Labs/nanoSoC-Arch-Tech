# Derived from RTL: nanosoc_arch_tech/rtl/src/subsystems/cpu_plus/nanosoc_ss_cpu_plus.v
#
# TRUE drop-in M0+ replacement for nanosoc_ss_cpu. The subsystem boundary
# (interfaces) is IDENTICAL to nanosoc_ss_cpu: same clocks/resets, AHB master
# (cpu_0) + slave (cpu_ss) ports, sys_remap_ctrl, CPU sideband, and the same
# CoreSight debug-slave bus (cpu_0_dbgahb). The ONLY differences vs the M0
# subsystem are inside the core instance:
#   * slcorem0  -> slcorem0p  (Cortex-M0 -> Cortex-M0+)
#   * VTOR=1    : Vector Table Offset Register enabled. (Reset value is 0, so
#                 boot still vectors from 0x0 and the existing sys_remap_ctrl
#                 alias keeps working unchanged — firmware can later program
#                 VTOR to retire the remap hack.)
#   * IOP=0     : single-cycle I/O port disabled. The chip-control CPU has no
#                 fast-IO peripheral, so all accesses go via AHB exactly like
#                 the M0. The wrapper's IO* ports always exist in RTL, so they
#                 are tied off internally here (IORDATA=0, outputs unconnected)
#                 and NOT brought to the subsystem boundary.
#   * MPU=0     : Memory Protection Unit not fitted.
#
# DEBUG: EXTERNAL_DAP=1 (same as nanosoc_ss_cpu). The per-core CM0PDAP is
# omitted and the Cortex-M0+ debug-slave bus is driven from the SoC-level
# CoreSight SoC-400 AHB-AP via the DBGAHB_* ports. Per-core SWD pins are tied
# off. This matches how the multicore SoC top wires u_cpu_ss_1, so swapping
# nanosoc_ss_cpu -> nanosoc_ss_cpu_plus needs NO top-level rewiring.

module:
  name: nanosoc_ss_cpu_plus
  gen: True
  desc: >
    CPU+ subsystem containing ARM Cortex-M0+ core (slcorem0p) with local
    memories (boot ROM, instruction memory, data memory) and an internal
    2-initiator x 4-target AHB busmatrix. Generates sys_hclk and sys_hresetn
    from sys_fclk and sys_sysresetn via the PRMU. The internal busmatrix
    supports memory remap (IMEM overlay at 0x00000000 controlled by
    sys_remap_ctrl[0]). Drop-in M0+ alternative to nanosoc_ss_cpu (identical
    boundary; VTOR enabled, IOP/MPU off; debug via system DAP / DBGAHB).

  params:
    SYS_ADDR_W:      { type: int, default: 32,           desc: "System address width" }
    SYS_DATA_W:      { type: int, default: 32,           desc: "System data width" }
    CLKGATE_PRESENT: { type: int, default: 0,            desc: "Clock gating present in CPU core" }
    BE:              { type: int, default: 0,            desc: "Endianness: 0=little, 1=big" }
    BKPT:            { type: int, default: 4,            desc: "Number of breakpoint comparators" }
    DBG:             { type: int, default: 1,            desc: "Debug configuration enable" }
    NUMIRQ:          { type: int, default: 32,           desc: "Number of IRQ lines" }
    SMUL:            { type: int, default: 0,            desc: "Multiplier: 0=small, 1=fast" }
    SYST:            { type: int, default: 1,            desc: "SysTick enable" }
    WIC:             { type: int, default: 1,            desc: "Wake-up interrupt controller" }
    WICLINES:        { type: int, default: 34,           desc: "WIC lines" }
    WPT:             { type: int, default: 2,            desc: "Number of DWT comparators" }
    RESET_ALL_REGS:  { type: int, default: 0,            desc: "Reset all registers" }
    INCLUDE_JTAG:    { type: int, default: 0,            desc: "Include JTAG feature" }
    ROMTABLE_BASE:   { type: int, default: 0xE00FF003,   desc: "ROM table base address pointer" }
    BOOTROM_ADDR_W:  { type: int, default: 11,           desc: "Boot ROM address width (phys = 4 * 2^N bytes)" }
    IMEM_RAM_ADDR_W: { type: int, default: 14,           desc: "IMEM address width" }
    IMEM_RAM_DATA_W: { type: int, default: 32,           desc: "IMEM data width" }
    IMEM_MEM_FPGA_IMG: { type: str, default: "image.hex", desc: "FPGA image to preload into IMEM" }
    DMEM_RAM_ADDR_W: { type: int, default: 14,           desc: "DMEM address width" }
    DMEM_RAM_DATA_W: { type: int, default: 32,           desc: "DMEM data width" }
    # Cortex-M0+ specific parameters (VTOR on; IOP + MPU off — see header)
    IOP:             { type: int, default: 0,            desc: "Single-cycle I/O port: 0=disabled, 1=enabled" }
    VTOR:            { type: int, default: 1,            desc: "Vector Table Offset Register: 0=disabled, 1=enabled" }
    MPU:             { type: int, default: 0,            desc: "Memory Protection Unit: 0=disabled, 8=8 regions" }

  interfaces:
    # Clock and Reset inputs
    - { name: sys_fclk,       type: wire, direction: in,  params: { WIDTH: 1 }, desc: "Free-running clock input (from systemctrl_ss)" }
    - { name: sys_sysresetn,  type: wire, direction: in,  params: { WIDTH: 1 }, desc: "System reset input (active low)" }
    - { name: sys_scanenable, type: wire, direction: in,  params: { WIDTH: 1 }, desc: "Scan mode enable" }
    - { name: sys_testmode,   type: wire, direction: in,  params: { WIDTH: 1 }, desc: "Test mode enable" }

    # Reset request input
    - { name: sys_sysresetreq,     type: wire, direction: in,  params: { WIDTH: 1 }, desc: "System reset request from system managers" }
    - { name: cpu_0_prmuresetreq,  type: wire, direction: out, params: { WIDTH: 1 }, desc: "CPU PRMU reset request output" }

    # Generated clock and reset outputs
    - { name: sys_poresetn,  type: wire, direction: out, params: { WIDTH: 1 }, desc: "Power-on reset output (generated by PRMU)" }
    - { name: sys_hclk,      type: wire, direction: out, params: { WIDTH: 1 }, desc: "AHB clock output (generated by PRMU)" }
    - { name: sys_hresetn,   type: wire, direction: out, params: { WIDTH: 1 }, desc: "AHB reset output (generated by PRMU)" }

    # Power management
    - { name: cpu_0_pmuenable,      type: wire, direction: in,  params: { WIDTH: 1 }, desc: "Power management enable" }
    - { name: cpu_0_pmudbgresetreq, type: wire, direction: out, params: { WIDTH: 1 }, desc: "PMU debug reset request" }

    # Memory remap control
    - { name: sys_remap_ctrl, type: wire, direction: in, params: { WIDTH: 4 }, desc: "Address remap control (bit 0 controls IMEM/bootrom overlay)" }

    # AHB master port — system traffic out (addresses >= 0x20000000)
    - { name: cpu_0, type: ahb, direction: initiator, params: { ADDR_WIDTH: 32, DATA_WIDTH: 32 }, desc: "CPU AHB master port (system traffic from internal busmatrix passthrough)" }

    # AHB slave port — debug/DMA access to local memories
    - { name: cpu_ss, type: ahb, direction: target, params: { ADDR_WIDTH: 32, DATA_WIDTH: 32, EXCLUDE: [hready] }, desc: "CPU subsystem AHB slave port (debug/DMA access to bootrom, imem, dmem)" }

    # CPU sideband
    - { name: cpu_0_nmi,          type: wire, direction: in,  params: { WIDTH: 1 },  desc: "Non-maskable interrupt" }
    - { name: cpu_0_irq,          type: wire, direction: in,  params: { WIDTH: 32 }, desc: "Maskable interrupt requests" }
    - { name: cpu_0_txev,         type: wire, direction: out, params: { WIDTH: 1 },  desc: "Send event (SEV) output" }
    - { name: cpu_0_rxev,         type: wire, direction: in,  params: { WIDTH: 1 },  desc: "Receive event input" }
    - { name: cpu_0_lockup,       type: wire, direction: out, params: { WIDTH: 1 },  desc: "CPU lockup status" }
    - { name: cpu_0_sysresetreq,  type: wire, direction: out, params: { WIDTH: 1 },  desc: "CPU system reset request" }
    - { name: cpu_0_sleeping,     type: wire, direction: out, params: { WIDTH: 1 },  desc: "CPU sleeping status" }
    - { name: cpu_0_sleepdeep,    type: wire, direction: out, params: { WIDTH: 1 },  desc: "CPU deep sleep status" }

    # Debug AHB-AP slave bus (CoreSight SoC-400 DAP -> matrix bridge -> slcorem0p
    # EXTERNAL_DAP=1 DBGAHB_* port group). Replaces the per-core SWD interface;
    # SWD is owned by the SoC-level SWJ-DP that drives the matrix DAP. Identical
    # to nanosoc_ss_cpu so the SoC top needs no rewiring.
    - { name: cpu_0_dbgahb, type: dbg_ahb, direction: receiver, params: {}, desc: "Cortex-M0+ debug-slave bus (driven by system DAP via matrix bridge)" }

  # Internal instances within cpu_ss
  instances:
    - instance_name: u_cpu_0
      module: slcorem0p
      addressable: False
      params: { CLKGATE_PRESENT: $CLKGATE_PRESENT, BE: $BE, BKPT: $BKPT, DBG: $DBG, NUMIRQ: $NUMIRQ, SMUL: $SMUL, SYST: $SYST, WIC: $WIC, WICLINES: $WICLINES, WPT: $WPT, RESET_ALL_REGS: $RESET_ALL_REGS, INCLUDE_JTAG: $INCLUDE_JTAG, ROMTABLE_BASE: $ROMTABLE_BASE, IOP: $IOP, VTOR: $VTOR, MPU: $MPU, EXTERNAL_DAP: 1 }
      connections:
        # AHB master — routed through internal busmatrix
        - { port: ahb_master, conn: nanosoc_cpu_ss_ahb_interconnect.cpu_0 }
        # Clock and Reset
        - { port: SYS_FCLK,       conn: sys_fclk }
        - { port: SYS_SYSRESETn,  conn: sys_sysresetn }
        - { port: SYS_SCANENABLE, conn: sys_scanenable }
        - { port: SYS_TESTMODE,   conn: sys_testmode }
        # Reset request
        - { port: SYS_SYSRESETREQ,   conn: sys_sysresetreq }
        - { port: CORE_PRMURESETREQ, conn: cpu_0_prmuresetreq }
        # Generated clocks and resets
        - { port: SYS_PORESETn, conn: sys_poresetn }
        - { port: SYS_HCLK,     conn: sys_hclk }
        - { port: SYS_HRESETn,  conn: sys_hresetn }
        # Power management
        - { port: CORE_PMUENABLE,      conn: cpu_0_pmuenable }
        - { port: CORE_PMUDBGRESETREQ, conn: cpu_0_pmudbgresetreq }
        # Single-cycle I/O port (M0+ IOP) — DISABLED (IOP=0) and tied off
        # internally; not exposed at the subsystem boundary so this stays a
        # drop-in for nanosoc_ss_cpu. IORDATA driven to 0; outputs left open.
        - { port: IOADDR,   conn: unconnected }
        - { port: IOTRANS,  conn: unconnected }
        - { port: IOWRITE,  conn: unconnected }
        - { port: IOSIZE,   conn: unconnected }
        - { port: IOWDATA,  conn: unconnected }
        - { port: IOPROT,   conn: unconnected }
        - { port: IORDATA,  conn: 32'h0 }
        - { port: IOMASTER, conn: unconnected }
        # CPU sideband
        - { port: CORE_NMI,          conn: cpu_0_nmi }
        - { port: CORE_IRQ,          conn: cpu_0_irq }
        - { port: CORE_TXEV,         conn: cpu_0_txev }
        - { port: CORE_RXEV,         conn: cpu_0_rxev }
        - { port: CORE_LOCKUP,       conn: cpu_0_lockup }
        - { port: CORE_SYSRESETREQ,  conn: cpu_0_sysresetreq }
        - { port: CORE_SLEEPING,     conn: cpu_0_sleeping }
        - { port: CORE_SLEEPDEEP,    conn: cpu_0_sleepdeep }
        # Per-core SWD pins are tied off — slcorem0p with EXTERNAL_DAP=1 ignores
        # them. The system DAP at the SoC top drives the DBGAHB bus.
        - { port: CORE_SWDI,   conn: 1'b1 }
        - { port: CORE_SWCLK,  conn: 1'b0 }
        - { port: CORE_SWDO,   conn: unconnected, desc: "Tied off in EXTERNAL_DAP=1" }
        - { port: CORE_SWDOEN, conn: unconnected, desc: "Tied off in EXTERNAL_DAP=1" }
        # Debug AHB-AP slave bus — driven by the system DAP via matrix bridge
        - { port: DBGAHB_SLVADDR,  conn: cpu_0_dbgahb_slvaddr }
        - { port: DBGAHB_SLVWDATA, conn: cpu_0_dbgahb_slvwdata }
        - { port: DBGAHB_SLVTRANS, conn: cpu_0_dbgahb_slvtrans }
        - { port: DBGAHB_SLVWRITE, conn: cpu_0_dbgahb_slvwrite }
        - { port: DBGAHB_SLVSIZE,  conn: cpu_0_dbgahb_slvsize }
        - { port: DBGAHB_SLVRDATA, conn: cpu_0_dbgahb_slvrdata }
        - { port: DBGAHB_SLVREADY, conn: cpu_0_dbgahb_slvready }
        - { port: DBGAHB_SLVRESP,  conn: cpu_0_dbgahb_slvresp }

    - instance_name: u_region_bootrom_0
      module: nanosoc_region_bootrom
      addressable: True
      params: { SYS_ADDR_W: $SYS_ADDR_W, SYS_DATA_W: $SYS_DATA_W, ROM_ADDR_W: $BOOTROM_ADDR_W }
      connections:
        - { port: HCLK,      conn: sys_hclk }
        - { port: ahb_slave, conn: nanosoc_cpu_ss_ahb_interconnect.bootrom_0 }

    - instance_name: u_region_imem_0
      module: nanosoc_region_imem
      addressable: True
      params: { SYS_ADDR_W: $SYS_ADDR_W, SYS_DATA_W: $SYS_DATA_W, RAM_ADDR_W: $IMEM_RAM_ADDR_W, RAM_DATA_W: $IMEM_RAM_DATA_W, MEM_FPGA_IMG: $IMEM_MEM_FPGA_IMG }
      connections:
        - { port: HCLK,      conn: sys_hclk }
        - { port: HRESETn,   conn: sys_hresetn }
        - { port: ahb_slave, conn: nanosoc_cpu_ss_ahb_interconnect.imem_0 }

    - instance_name: u_region_dmem_0
      module: nanosoc_region_dmem
      addressable: True
      params: { SYS_ADDR_W: $SYS_ADDR_W, SYS_DATA_W: $SYS_DATA_W, RAM_ADDR_W: $DMEM_RAM_ADDR_W, RAM_DATA_W: $DMEM_RAM_DATA_W }
      connections:
        - { port: HCLK,      conn: sys_hclk }
        - { port: HRESETn,   conn: sys_hresetn }
        - { port: ahb_slave, conn: nanosoc_cpu_ss_ahb_interconnect.dmem_0 }

  # Internal busmatrix — 2 initiators x 4 targets (IDENTICAL to nanosoc_ss_cpu)
  interconnects:
    - name: nanosoc_cpu_ss_ahb_interconnect
      gen: True
      type: ahb_lite
      desc: >
        CPU subsystem internal busmatrix. Routes CPU core and external slave
        port accesses to local memories and system passthrough. Supports
        address remap via sys_remap_ctrl[0]: when set, IMEM overlays bootrom
        at 0x00000000.

      connections:
        - { port: sys_hclk,        conn: sys_hclk }
        - { port: sys_hresetn,     conn: sys_hresetn }
        - { port: sys_scanenable,  conn: sys_scanenable }
        - { port: sys_scaninhclk,  conn: 1'b0 }
        - { port: sys_remap_ctrl,  conn: sys_remap_ctrl }

      targets:
        - { name: bootrom_0, base: 0x00000000, size: 0x08000000, phys_size: "4 * (2 ** $BOOTROM_ADDR_W)", sw_access: rx,  region_type: memory, role: bootrom, desc: "Boot ROM (alias at 0x00000000, default at 0x08000000)" }
        - { name: imem_0,    base: 0x10000000, size: 0x08000000, phys_size: "4 * (2 ** $IMEM_RAM_ADDR_W)", sw_access: rwx, region_type: memory, role: None,    desc: "Instruction memory (remappable to 0x00000000)" }
        - { name: dmem_0,    base: 0x18000000, size: 0x08000000, phys_size: "4 * (2 ** $DMEM_RAM_ADDR_W)", sw_access: rwx, region_type: memory, role: None,    desc: "Data memory" }
        - { name: system,    base: 0x20000000, size: 0xE0000000, sw_access: rw,  region_type: ~,      role: ~, passthrough: cpu_0, desc: "System passthrough to external AHB master port (cpu_0)" }

      initiators:
        - name: cpu_0
          targets:
            - name: bootrom_0
              visibility:
                - base: 0x00000000
                - base: 0x08000000
            - name: imem_0
              visibility:
                - base: 0x00000000
                  remap:
                    remapping: true
                    remap_behaviour: alias
                    remap_bit: 0
                - base: 0x10000000
            - name: dmem_0
            - name: system

        - name: cpu_ss
          passthrough: cpu_ss
          targets:
            # Default bootrom views (0x0 remap alias, 0x08000000 default).
            # Additional alias at 0x80000000 so an external DMA initiator
            # driving this slave port from a top-level aperture rooted at
            # 0x80000000 lands in bootrom. The CPU-internal `cpu_0` initiator
            # never drives 0x8xxx_xxxx — its system passthrough (0x20+)
            # covers the range but its target list excludes admin aliases.
            - name: bootrom_0
              visibility:
                - base: 0x00000000
                - base: 0x08000000
                - base: 0x80000000
            # imem visible at 0x0 (under REMAP) / 0x10000000 / 0x90000000
            # (admin alias, same aperture shape as 0x10000000, base shifted
            # +0x80000000 to match the top-level admin aperture).
            - name: imem_0
              visibility:
                - base: 0x00000000
                  remap:
                    remapping: true
                    remap_behaviour: alias
                    remap_bit: 0
                - base: 0x10000000
                - base: 0x90000000
            # dmem at local 0x18000000 + admin alias at 0x98000000.
            - name: dmem_0
              visibility:
                - base: 0x18000000
                - base: 0x98000000
            # Note: cpu_ss initiator cannot access 'system' target (prevents routing loops)
