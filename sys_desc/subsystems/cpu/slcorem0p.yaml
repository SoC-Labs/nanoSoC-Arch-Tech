# Derived from RTL: nanosoc_arch_tech/rtl/slcorem0p_tech/src/verilog/slcorem0p.v
#
# ARM Cortex-M0+ core wrapper with integrated PRMU (Power/Reset Management Unit).
# Generates sys_hclk and sys_hresetn from sys_fclk and sys_sysresetn.
# Provides AHB-Lite master port, single-cycle I/O port (IOP), CPU sideband,
# SWD debug, and (when EXTERNAL_DAP=1) a DBGAHB debug-slave bus.
#
# This is the canonical, on-lib-path M0+ core block definition, analogous to
# slcorem0.yaml. It is INERT: nothing references it yet.

module:
  name: slcorem0p
  gen: False
  desc: >
    ARM Cortex-M0+ core wrapper with integrated PRMU. Generates AHB clock
    (sys_hclk) and reset (sys_hresetn) from free-running clock (sys_fclk)
    and system reset (sys_sysresetn). Exposes AHB-Lite master port,
    single-cycle I/O port (IOP), CPU sideband signals, SWD debug interface
    (EXTERNAL_DAP=0) or DBGAHB debug-slave bus (EXTERNAL_DAP=1), and power
    management controls. Extends M0 with IOP, VTOR, and MPU.

  params:
    CLKGATE_PRESENT: { type: int, default: 0,          desc: "Architectural clock gating support" }
    BE:              { type: int, default: 0,           desc: "Endianness: 0=little, 1=big" }
    BKPT:            { type: int, default: 4,           desc: "Number of breakpoint comparators" }
    DBG:             { type: int, default: 1,           desc: "Debug configuration enable" }
    NUMIRQ:          { type: int, default: 32,          desc: "Number of IRQ lines" }
    SMUL:            { type: int, default: 0,           desc: "Multiplier: 0=small, 1=fast" }
    SYST:            { type: int, default: 1,           desc: "SysTick enable" }
    WIC:             { type: int, default: 1,           desc: "Wake-up interrupt controller" }
    WICLINES:        { type: int, default: 34,          desc: "WIC lines" }
    WPT:             { type: int, default: 2,           desc: "Number of DWT comparators" }
    RESET_ALL_REGS:  { type: int, default: 0,           desc: "Reset all registers" }
    INCLUDE_JTAG:    { type: int, default: 0,           desc: "Include JTAG feature" }
    EXTERNAL_DAP:    { type: int, default: 0,           desc: "0=internal CM0PDAP + SWD pins, 1=external system DAP via DBGAHB_* bus" }
    ROMTABLE_BASE:   { type: int, default: 0xE00FF000,  desc: "ROM table base address pointer" }
    # Cortex-M0+ specific parameters
    IOP:             { type: int, default: 1,           desc: "Single-cycle I/O port: 0=disabled, 1=enabled" }
    VTOR:            { type: int, default: 1,           desc: "Vector Table Offset Register: 0=disabled, 1=enabled" }
    MPU:             { type: int, default: 0,           desc: "Memory Protection Unit: 0=disabled, 8=8 regions" }

  interfaces:
    # Clock and Reset inputs
    - { name: SYS_FCLK,       type: wire, direction: in,  params: { WIDTH: 1 }, desc: "Free-running clock input" }
    - { name: SYS_SYSRESETn,  type: wire, direction: in,  params: { WIDTH: 1 }, desc: "System reset input (active low)" }
    - { name: SYS_SCANENABLE, type: wire, direction: in,  params: { WIDTH: 1 }, desc: "Scan mode enable" }
    - { name: SYS_TESTMODE,   type: wire, direction: in,  params: { WIDTH: 1 }, desc: "Test mode enable" }

    # Reset request
    - { name: SYS_SYSRESETREQ,  type: wire, direction: in,  params: { WIDTH: 1 }, desc: "System reset request input" }
    - { name: CORE_PRMURESETREQ, type: wire, direction: out, params: { WIDTH: 1 }, desc: "PRMU reset request output" }

    # Generated clocks and resets
    - { name: SYS_PORESETn, type: wire, direction: out, params: { WIDTH: 1 }, desc: "Power-on reset output (generated by PRMU)" }
    - { name: SYS_HCLK,     type: wire, direction: out, params: { WIDTH: 1 }, desc: "AHB clock output (generated by PRMU)" }
    - { name: SYS_HRESETn,  type: wire, direction: out, params: { WIDTH: 1 }, desc: "AHB reset output (generated by PRMU)" }

    # Power management
    - { name: CORE_PMUENABLE,      type: wire, direction: in,  params: { WIDTH: 1 }, desc: "Power management enable" }
    - { name: CORE_PMUDBGRESETREQ, type: wire, direction: out, params: { WIDTH: 1 }, desc: "PMU debug reset request" }

    # AHB-Lite master port (bare uppercase port names matching actual RTL)
    - { name: ahb_master, type: ahb, direction: initiator, params: { ADDR_WIDTH: 32, DATA_WIDTH: 32 }, desc: "AHB-Lite master port" }

    # Single-cycle I/O port (M0+ specific, active when IOP=1)
    - { name: IOADDR,   type: wire, direction: out, params: { WIDTH: 32 }, desc: "I/O address bus" }
    - { name: IOTRANS,  type: wire, direction: out, params: { WIDTH: 1 },  desc: "I/O transfer request" }
    - { name: IOWRITE,  type: wire, direction: out, params: { WIDTH: 1 },  desc: "I/O transfer direction" }
    - { name: IOSIZE,   type: wire, direction: out, params: { WIDTH: 3 },  desc: "I/O transfer size" }
    - { name: IOWDATA,  type: wire, direction: out, params: { WIDTH: 32 }, desc: "I/O write data" }
    - { name: IOPROT,   type: wire, direction: out, params: { WIDTH: 4 },  desc: "I/O protection control" }
    - { name: IORDATA,  type: wire, direction: in,  params: { WIDTH: 32 }, desc: "I/O read data" }
    - { name: IOMASTER, type: wire, direction: out, params: { WIDTH: 1 },  desc: "I/O master indicator" }

    # CPU sideband
    - { name: CORE_NMI,          type: wire, direction: in,  params: { WIDTH: 1 },  desc: "Non-maskable interrupt" }
    - { name: CORE_IRQ,          type: wire, direction: in,  params: { WIDTH: 32 }, desc: "Maskable interrupt requests" }
    - { name: CORE_TXEV,         type: wire, direction: out, params: { WIDTH: 1 },  desc: "Send event (SEV) output" }
    - { name: CORE_RXEV,         type: wire, direction: in,  params: { WIDTH: 1 },  desc: "Receive event input" }
    - { name: CORE_LOCKUP,       type: wire, direction: out, params: { WIDTH: 1 },  desc: "CPU lockup status" }
    - { name: CORE_SYSRESETREQ,  type: wire, direction: out, params: { WIDTH: 1 },  desc: "CPU system reset request" }
    - { name: CORE_SLEEPING,     type: wire, direction: out, params: { WIDTH: 1 },  desc: "CPU sleeping status" }
    - { name: CORE_SLEEPDEEP,    type: wire, direction: out, params: { WIDTH: 1 },  desc: "CPU deep sleep status" }

    # Serial Wire Debug (active when EXTERNAL_DAP=0; tied to safe values when EXTERNAL_DAP=1)
    - { name: CORE_SWDI,   type: wire, direction: in,  params: { WIDTH: 1 }, desc: "SWD data input" }
    - { name: CORE_SWCLK,  type: wire, direction: in,  params: { WIDTH: 1 }, desc: "SWD clock" }
    - { name: CORE_SWDO,   type: wire, direction: out, params: { WIDTH: 1 }, desc: "SWD data output" }
    - { name: CORE_SWDOEN, type: wire, direction: out, params: { WIDTH: 1 }, desc: "SWD data output enable" }

    # Debug AHB-AP slave bus (active when EXTERNAL_DAP=1; ignored when EXTERNAL_DAP=0).
    # Driven by a system-level CoreSight DAP. Existing instances may leave these unconnected.
    - { name: DBGAHB_SLVADDR,  type: wire, direction: in,  params: { WIDTH: 32 }, desc: "Debug slave address from system DAP" }
    - { name: DBGAHB_SLVWDATA, type: wire, direction: in,  params: { WIDTH: 32 }, desc: "Debug slave write data" }
    - { name: DBGAHB_SLVTRANS, type: wire, direction: in,  params: { WIDTH: 2 },  desc: "Debug slave transfer type" }
    - { name: DBGAHB_SLVWRITE, type: wire, direction: in,  params: { WIDTH: 1 },  desc: "Debug slave write enable" }
    - { name: DBGAHB_SLVSIZE,  type: wire, direction: in,  params: { WIDTH: 2 },  desc: "Debug slave transfer size" }
    - { name: DBGAHB_SLVRDATA, type: wire, direction: out, params: { WIDTH: 32 }, desc: "Debug slave read data to system DAP" }
    - { name: DBGAHB_SLVREADY, type: wire, direction: out, params: { WIDTH: 1 },  desc: "Debug slave ready to system DAP" }
    - { name: DBGAHB_SLVRESP,  type: wire, direction: out, params: { WIDTH: 1 },  desc: "Debug slave response to system DAP" }
