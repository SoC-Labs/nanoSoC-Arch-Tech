# Derived from RTL: compute-subsystem/src/rtl/cortexm4_ahb_wrap.v
#
# Hand-authored wrapper around the Arm CORTEXM4INTEGRATION IP. The integration
# IP itself is sourced READ-ONLY from /research/AAA/ip_library/Cortex-M4 via the
# flist (never copied/edited here); this block describes only the wrapper's
# boundary so nanosoc_gen can instantiate + wire it like any core block.
#
# v1 (single-master): the wrapper merges the M4's three native master buses
# (I-Code + D-Code via a code-mux, and System) into ONE standard AHB-Lite master
# `ahb_master`, adapting HRESP[1:0]->[0], tying MEMATTR, and terminating
# exclusives. It also normalises debug to a DBGAHB-style slave bus so the SoC's
# existing CoreSight DAP / matrix-bridge wiring is reused (the M4's own SW/JTAG-DP
# is tied off inside the wrapper). This makes slcorem4 a structural drop-in for
# the M0+ core block (slcorem0p) from the generator's point of view.
#
# Clock/reset: unlike slcorem0p (which has an integrated PRMU and GENERATES
# sys_hclk/sys_hresetn), the M4 takes its clocks/resets as INPUTS — the compute
# subsystem is a clock/reset CONSUMER, driven by the SoC manager core (CPU1 M0+).
#
# The structured 2-master (Code+System) upgrade is a documented v2 (see
# docs/M4_STRUCTURED_BUS_GENERATOR_DESIGN.md); it keeps this same external
# boundary, so the SoC integration does not change.

module:
  name: slcorem4
  gen: False
  desc: >
    ARM Cortex-M4 core wrapper (CORTEXM4INTEGRATION + code-mux + AHB-Lite
    protocol adaptation). Presents a single AHB-Lite master, wide NVIC IRQ bus,
    CPU sideband, and a DBGAHB debug-slave bus. Clock/reset consumer (no PRMU).
    FPU + MPU enabled; trace/ETM excluded (TRACE_LVL=1).

  params:
    # Cortex-M4 integration parameters (mirror CORTEXM4INTEGRATION; see the IP).
    FPU_PRESENT:     { type: int, default: 1,  desc: "Include the FPU (single-precision M4F)" }
    MPU_PRESENT:     { type: int, default: 1,  desc: "Include the MPU" }
    NUM_IRQ:         { type: int, default: 64, desc: "Number of external NVIC IRQ lines (1..240)" }
    LVL_WIDTH:       { type: int, default: 4,  desc: "Interrupt priority bits (3..8)" }
    TRACE_LVL:       { type: int, default: 1,  desc: "0=none,1=ITM/DWT,2=+ETM(license),3=+HTM" }
    DEBUG_LVL:       { type: int, default: 3,  desc: "0=none(no DAP)..3=full" }
    BB_PRESENT:      { type: int, default: 1,  desc: "Bit-banding" }
    # WIC_PRESENT and CLKGATE_PRESENT are GONE from the wrapper (f968b94): at 0
    # cm4_wic's outputs are all constants and the four cm4_clk_gate instances
    # collapse to wires, so both were replaced by those constants rather than
    # carried as dead knobs. Declaring them here made gen-soc emit overrides for
    # parameters that no longer exist -> CDFG-214.
    # DEFAULT 0 IS DELIBERATE AND SAFETY-CRITICAL. At 1 the wrapper does NOT
    # instantiate DAPSWJDP and ties CORE_SWDO/CORE_SWDOEN to constants, so unless
    # a SoC-400 DP elsewhere in the design drives DAP_*, the die has NO debug
    # ingress at all — and it elaborates cleanly while doing it. Internal DP is
    # the safe default; opt IN to external, never inherit it.
    EXTERNAL_DAP:    { type: int, default: 0,  desc: "0 = internal DAPSWJDP on the CORE_SW*/TDI/TDO pins (SAFE DEFAULT). 1 = CORTEXM4 instantiated directly with its DAP bus exported on DAP_* for an external CoreSight DP — ONLY valid if such a DP exists and is wired" }
    RESET_ALL_REGS:  { type: int, default: 0,  desc: "Reset all registers" }
    BE:              { type: int, default: 0,  desc: "Endianness: 0=little (BIGEND), 1=big" }

  interfaces:
    # Clock and Reset INPUTS (consumer — driven by the SoC manager PRMU)
    - { name: SYS_FCLK,       type: wire, direction: in, params: { WIDTH: 1 }, desc: "Free-running clock input" }
    - { name: SYS_HCLK,       type: wire, direction: in, params: { WIDTH: 1 }, desc: "AHB clock input (from manager PRMU)" }
    - { name: SYS_PORESETn,   type: wire, direction: in, params: { WIDTH: 1 }, desc: "Power-on reset input (active low)" }
    - { name: SYS_HRESETn,    type: wire, direction: in, params: { WIDTH: 1 }, desc: "AHB reset input (active low)" }
    - { name: SYS_SYSRESETn,  type: wire, direction: in, params: { WIDTH: 1 }, desc: "System reset input (active low)" }
    - { name: SYS_SCANENABLE, type: wire, direction: in, params: { WIDTH: 1 }, desc: "Scan mode enable" }
    - { name: SYS_TESTMODE,   type: wire, direction: in, params: { WIDTH: 1 }, desc: "Test mode enable" }

    # Three AHB-Lite masters (I-Code, D-Code, System) exposed directly; the
    # compute_ss busmatrix arbitrates them. Non-`ahb_master` names => the subsystem
    # backend expands each to {name}_<sig> RTL ports (mst_i_haddr, ...).
    - { name: mst_i, type: ahb, direction: initiator, params: { ADDR_WIDTH: 32, DATA_WIDTH: 32 }, desc: "M4 I-Code AHB-Lite master (fetch-only)" }
    - { name: mst_d, type: ahb, direction: initiator, params: { ADDR_WIDTH: 32, DATA_WIDTH: 32 }, desc: "M4 D-Code AHB-Lite master" }
    - { name: mst_s, type: ahb, direction: initiator, params: { ADDR_WIDTH: 32, DATA_WIDTH: 32 }, desc: "M4 System AHB-Lite master" }

    # CPU sideband
    - { name: CORE_NMI,         type: wire, direction: in,  params: { WIDTH: 1 },        desc: "Non-maskable interrupt" }
    - { name: CORE_IRQ,         type: wire, direction: in,  params: { WIDTH: $NUM_IRQ }, desc: "NVIC maskable interrupt requests" }
    - { name: CORE_TXEV,        type: wire, direction: out, params: { WIDTH: 1 },        desc: "Send event (SEV) output" }
    - { name: CORE_RXEV,        type: wire, direction: in,  params: { WIDTH: 1 },        desc: "Receive event input" }
    - { name: CORE_LOCKUP,      type: wire, direction: out, params: { WIDTH: 1 },        desc: "CPU lockup status" }
    - { name: CORE_SYSRESETREQ, type: wire, direction: out, params: { WIDTH: 1 },        desc: "CPU system reset request" }
    - { name: CORE_SLEEPING,    type: wire, direction: out, params: { WIDTH: 1 },        desc: "CPU sleeping status" }
    - { name: CORE_SLEEPDEEP,   type: wire, direction: out, params: { WIDTH: 1 },        desc: "CPU deep sleep status" }
    - { name: CORE_FPU_FLAGS,   type: wire, direction: out, params: { WIDTH: 6 },        desc: "FPU cumulative exception flags {IXC,OFC,UFC,IOC,DZC,IDC}" }

    # The M4 has NO debug slave port, so there is no DBGAHB group. CORTEXM0PLUS
    # exposes SLV* (ten ports); CORTEXM4INTEGRATION exposes none. The old
    # DBGAHB_SLV* declarations here described a bus the wrapper only ever stubbed,
    # and they outlived the ports themselves in f968b94 -> eight UPIMI-E
    # "Port DBGAHB_SLVADDR is not defined in module slcorem4".
    #
    # What replaces them is the core's OWN AHB-AP, whose slave side is a standard
    # CoreSight DAPBUS. Active only at EXTERNAL_DAP=1; at the default 0 these are
    # unused and the internal DAPSWJDP drives the CORE_SW* pins instead.
    - { name: DAP_CLK,    type: wire, direction: in,  params: { WIDTH: 1 },  desc: "AP-slave bus clock (EXTERNAL_DAP=1)" }
    - { name: DAP_CLKEN,  type: wire, direction: in,  params: { WIDTH: 1 },  desc: "AP-slave bus clock enable" }
    - { name: DAP_RESETn, type: wire, direction: in,  params: { WIDTH: 1 },  desc: "AP-slave bus reset" }
    - { name: DAP_SEL,    type: wire, direction: in,  params: { WIDTH: 1 },  desc: "This AP's decoded select from the DP" }
    - { name: DAP_ENABLE, type: wire, direction: in,  params: { WIDTH: 1 },  desc: "DAP access phase strobe" }
    - { name: DAP_WRITE,  type: wire, direction: in,  params: { WIDTH: 1 },  desc: "DAP write not read" }
    - { name: DAP_ABORT,  type: wire, direction: in,  params: { WIDTH: 1 },  desc: "DAP abort" }
    - { name: DAP_ADDR,   type: wire, direction: in,  params: { WIDTH: 6 },  desc: "AP register address, dapcaddr[7:2]" }
    - { name: DAP_WDATA,  type: wire, direction: in,  params: { WIDTH: 32 }, desc: "DAP write data" }
    - { name: DAP_READY,  type: wire, direction: out, params: { WIDTH: 1 },  desc: "DAP transfer ready" }
    - { name: DAP_SLVERR, type: wire, direction: out, params: { WIDTH: 1 },  desc: "DAP slave error" }
    - { name: DAP_RDATA,  type: wire, direction: out, params: { WIDTH: 32 }, desc: "DAP read data" }
    # Debug authentication / power-up, and debug sideband promoted from tie-offs.
    - { name: DBG_EN,            type: wire, direction: in,  params: { WIDTH: 1 }, desc: "DBGEN — debug enable" }
    - { name: DBG_PWRUP,         type: wire, direction: in,  params: { WIDTH: 1 }, desc: "Debug power-up ack (CDBGPWRUPACK-equivalent)" }
    - { name: CORE_EDBGRQ,       type: wire, direction: in,  params: { WIDTH: 1 }, desc: "External debug request (was tied 0)" }
    - { name: CORE_DBGRESTART,   type: wire, direction: in,  params: { WIDTH: 1 }, desc: "Synchronised restart request" }
    - { name: CORE_DBGRESTARTED, type: wire, direction: out, params: { WIDTH: 1 }, desc: "Restart acknowledge" }
    - { name: CORE_HALTED,       type: wire, direction: out, params: { WIDTH: 1 }, desc: "Core is halted in debug state" }
