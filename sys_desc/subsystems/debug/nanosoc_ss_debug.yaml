# Derived from RTL: nanosoc_arch_tech/rtl/src/subsystems/debug/verilog/nanosoc_ss_debug.v
#
# Contains socdebug_ahb (ADP debug controller with AHB master) and
# socdebug_usrt_control (USRT APB peripheral). ADP provides full system
# access via AHB master. USRT provides APB-accessible serial interface.

module:
  name: nanosoc_ss_debug
  gen: False
  desc: >
    Debug subsystem containing SoCDebug ADP controller (AHB master for full
    system access) and USRT control (APB slave for serial interface registers).
    Internally connects socdebug_ahb to socdebug_usrt_control via AXI byte
    streams. Provides baud rate divider output for FT1248 clock control.

  params:
    SYS_ADDR_W:  { type: int, default: 32,  desc: "System address width" }
    SYS_DATA_W:  { type: int, default: 32,  desc: "System data width" }
    PROMPT_CHAR: { type: str, default: "]", desc: "SoCDebug prompt character" }

  interfaces:
    # Clocks and Resets
    - { name: SYS_HCLK,    type: wire, direction: in, params: { WIDTH: 1 }, desc: "AHB clock" }
    - { name: SYS_HRESETn, type: wire, direction: in, params: { WIDTH: 1 }, desc: "AHB reset (active low)" }
    - { name: SYS_PCLK,    type: wire, direction: in, params: { WIDTH: 1 }, desc: "APB clock" }
    - { name: SYS_PCLKG,   type: wire, direction: in, params: { WIDTH: 1 }, desc: "Gated APB clock" }
    - { name: SYS_PRESETn, type: wire, direction: in, params: { WIDTH: 1 }, desc: "APB reset (active low)" }

    # AHB master port — ADP debug access to full system
    - { name: DEBUG, type: ahb, direction: initiator, params: { ADDR_WIDTH: $SYS_ADDR_W, DATA_WIDTH: $SYS_DATA_W }, desc: "Debug AHB master port (full system access)" }

    # AXI-Stream byte ports — ADP communication
    - { name: ADP_RXD, type: axis_byte, direction: out, params: {}, desc: "ADP receive byte stream output (to extio_ss)" }
    - { name: ADP_TXD, type: axis_byte, direction: in,  params: {}, desc: "ADP transmit byte stream input (from extio_ss)" }

    # APB slave port — USRT control registers
    # Note: PADDR is [11:2] (word-aligned, 10-bit), not full [11:0]
    - { name: DEBUG_APB, type: apb, direction: target, params: { ADDR_WIDTH: 10, DATA_WIDTH: 32 }, desc: "USRT APB slave port (connected via soc_peripheral extension port 14)" }

    # Baud rate divider
    - { name: DEBUG_INVBAUDDIV8, type: wire, direction: out, params: { WIDTH: 8 }, desc: "Inverted baud rate divider (controls FT1248 clock division)" }

    # USRT interrupt outputs (unconnected in nanosoc.sv)
    - { name: DEBUG_TXINT,    type: wire, direction: out, params: { WIDTH: 1 }, desc: "USRT TX interrupt" }
    - { name: DEBUG_RXINT,    type: wire, direction: out, params: { WIDTH: 1 }, desc: "USRT RX interrupt" }
    - { name: DEBUG_TXOVRINT, type: wire, direction: out, params: { WIDTH: 1 }, desc: "USRT TX overrun interrupt" }
    - { name: DEBUG_RXOVRINT, type: wire, direction: out, params: { WIDTH: 1 }, desc: "USRT RX overrun interrupt" }
    - { name: DEBUG_UARTINT,  type: wire, direction: out, params: { WIDTH: 1 }, desc: "USRT combined interrupt" }

    # GPIO interface (8-bit)
    - { name: GPO8, type: wire, direction: out, params: { WIDTH: 8 }, desc: "ADP general purpose output (bit 0 = debug reset request)" }
    - { name: GPI8, type: wire, direction: in,  params: { WIDTH: 8 }, desc: "ADP general purpose input (looped back from GPO8 in nanosoc.sv)" }
