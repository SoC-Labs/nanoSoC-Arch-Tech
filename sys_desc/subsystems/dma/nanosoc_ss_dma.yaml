# Derived from RTL: nanosoc_arch_tech/rtl/src/subsystems/dma/verilog/nanosoc_ss_dma.sv
#
# Contains up to 2 configurable DMA controllers (PL230 or DMA350),
# nanosoc_region_dmac_ctrl for APB configuration registers, and
# 3 bidirectional AXI-Stream channels for expansion data streaming.

module:
  name: nanosoc_ss_dma
  gen: False
  desc: >
    DMA subsystem with two configurable DMA controllers. DMAC_0 supports
    PL230 (type 1) or DMA350 (type 2). DMAC_1 supports PL230 only.
    When DMAC_0_TYPE=2 (DMA350), the secondary AHB port routes DMAC_1 bus.
    DMA controllers are conditionally instantiated via generate blocks.

  params:
    SYS_ADDR_W:         { type: int, default: 32, desc: "System address width" }
    SYS_DATA_W:         { type: int, default: 32, desc: "System data width" }
    APB_ADDR_W:         { type: int, default: 12, desc: "APB address width" }
    APB_DATA_W:         { type: int, default: 32, desc: "APB data width" }
    DMAC_0_TYPE:        { type: int, default: 0,  desc: "DMAC 0 type: 0=None, 1=PL230, 2=DMA350" }
    DMAC_1_TYPE:        { type: int, default: 0,  desc: "DMAC 1 type: 0=None, 1=PL230" }
    DMAC_0_CHANNEL_NUM: { type: int, default: 4,  desc: "DMAC 0 channel count" }
    DMAC_1_CHANNEL_NUM: { type: int, default: 2,  desc: "DMAC 1 channel count" }

  interfaces:
    # Clocks and Resets
    - { name: sys_hclk,    type: wire, direction: in, params: { WIDTH: 1 }, desc: "AHB clock" }
    - { name: sys_hresetn, type: wire, direction: in, params: { WIDTH: 1 }, desc: "AHB reset (active low)" }
    - { name: sys_pclk,    type: wire, direction: in, params: { WIDTH: 1 }, desc: "APB clock" }
    - { name: sys_pclkg,   type: wire, direction: in, params: { WIDTH: 1 }, desc: "Gated APB clock" }
    - { name: sys_presetn,  type: wire, direction: in, params: { WIDTH: 1 }, desc: "APB reset (active low)" }
    - { name: sys_pclken,  type: wire, direction: in, params: { WIDTH: 1 }, desc: "APB clock enable" }

    # AHB master ports — DMA data transfers
    - { name: dmac_0, type: ahb, direction: initiator, params: { ADDR_WIDTH: $SYS_ADDR_W, DATA_WIDTH: $SYS_DATA_W }, desc: "DMAC 0 AHB master port" }
    - { name: dmac_1, type: ahb, direction: initiator, params: { ADDR_WIDTH: $SYS_ADDR_W, DATA_WIDTH: $SYS_DATA_W }, desc: "DMAC 1 AHB master port" }

    # AHB slave port — DMA controller configuration registers
    - { name: dmac_ctrl, type: ahb, direction: target, params: { ADDR_WIDTH: $SYS_ADDR_W, DATA_WIDTH: $SYS_DATA_W }, desc: "DMAC control AHB slave port (APB-bridged config registers)" }

    # AXI-Stream output channels (DMAC -> Expansion)
    - { name: dmac_str_out_0, type: axis, direction: out, params: { DATA_WIDTH: $SYS_DATA_W }, desc: "DMA stream output channel 0" }
    - { name: dmac_str_out_1, type: axis, direction: out, params: { DATA_WIDTH: $SYS_DATA_W }, desc: "DMA stream output channel 1" }
    - { name: dmac_str_out_2, type: axis, direction: out, params: { DATA_WIDTH: $SYS_DATA_W }, desc: "DMA stream output channel 2" }

    # AXI-Stream input channels (Expansion -> DMAC, with flush)
    - { name: dmac_str_in_0, type: axis, direction: in, params: { DATA_WIDTH: $SYS_DATA_W, HAS_FLUSH: 1 }, desc: "DMA stream input channel 0" }
    - { name: dmac_str_in_1, type: axis, direction: in, params: { DATA_WIDTH: $SYS_DATA_W, HAS_FLUSH: 1 }, desc: "DMA stream input channel 1" }
    - { name: dmac_str_in_2, type: axis, direction: in, params: { DATA_WIDTH: $SYS_DATA_W, HAS_FLUSH: 1 }, desc: "DMA stream input channel 2" }

    # DMA request/status signals
    - { name: dmac_0_dma_req,  type: wire, direction: in,  params: { WIDTH: $DMAC_0_CHANNEL_NUM }, desc: "DMAC 0 DMA request inputs" }
    - { name: dmac_0_dma_done, type: wire, direction: out, params: { WIDTH: $DMAC_0_CHANNEL_NUM }, desc: "DMAC 0 DMA done outputs" }
    - { name: dmac_0_dma_err,  type: wire, direction: out, params: { WIDTH: 1 },                  desc: "DMAC 0 DMA error output" }
    - { name: dmac_1_dma_req,  type: wire, direction: in,  params: { WIDTH: $DMAC_1_CHANNEL_NUM }, desc: "DMAC 1 DMA request inputs" }
    - { name: dmac_1_dma_done, type: wire, direction: out, params: { WIDTH: $DMAC_1_CHANNEL_NUM }, desc: "DMAC 1 DMA done outputs" }
    - { name: dmac_1_dma_err,  type: wire, direction: out, params: { WIDTH: 1 },                  desc: "DMAC 1 DMA error output" }

    # Combined DMA status
    - { name: dmac_any_done,  type: wire, direction: out, params: { WIDTH: 1 }, desc: "Any DMA channel done (OR reduction)" }
    - { name: dmac_any_error, type: wire, direction: out, params: { WIDTH: 1 }, desc: "Any DMA channel error (OR reduction)" }

  # Internal instances with conditional instantiation (addresses shortcoming #11)
  instances:
    - instance_name: u_region_dmac_ctrl
      module: nanosoc_region_dmac_ctrl
      addressable: True
      params: {}
      connections:
        - { port: ahb_slave, conn: dmac_ctrl }

    - instance_name: u_dmac_0
      rtl_module: nanosoc_dma_wrapper
      condition: "$DMAC_0_TYPE > 0"
      addressable: False
      params: { DMAC_TYPE: $DMAC_0_TYPE, DMAC_CHANNEL_NUM: $DMAC_0_CHANNEL_NUM }
      connections:
        - { port: ahb_master, conn: dmac_0 }

    - instance_name: u_dmac_1
      rtl_module: nanosoc_dma_wrapper
      condition: "$DMAC_1_TYPE > 0 && $DMAC_0_TYPE != 2"
      addressable: False
      params: { DMAC_TYPE: $DMAC_1_TYPE, DMAC_CHANNEL_NUM: $DMAC_1_CHANNEL_NUM }
      connections:
        - { port: ahb_master, conn: dmac_1 }
