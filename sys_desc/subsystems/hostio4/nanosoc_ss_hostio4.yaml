# Derived from RTL: nanosoc_arch_tech/rtl/src/subsystems/hostio4/nanosoc_ss_hostio4.v
#
# Manages FT1248 FTDI interface routing and GPIO P1[6:0] muxing.
# Routes ADP, USRT0, USRT1 byte streams between internal subsystems
# and the external FT1248/EXTIO interface.
#
# NOTE: This module has ZERO parameters in RTL.

module:
  name: nanosoc_ss_hostio4
  gen: False
  desc: >
    HOSTIO4 subsystem. Routes AXI byte streams between debug/peripheral
    subsystems and the external FTDI FT1248 interface. Multiplexes GPIO P1[6:0]
    between FT1248 physical signals and HOSTIO4 data/control signals based on
    FT1248MODE input (driven by p1_in[7] in nanosoc.sv). Contains
    hostio4_controller internally.

  # No parameters — RTL has none
  params: {}

  interfaces:
    # Clock and Reset
    - { name: SYS_HCLK,    type: wire, direction: in, params: { WIDTH: 1 }, desc: "AHB clock" }
    - { name: SYS_HRESETn, type: wire, direction: in, params: { WIDTH: 1 }, desc: "AHB reset (active low)" }
    - { name: SYS_TESTMODE, type: wire, direction: in, params: { WIDTH: 1 }, desc: "Test mode enable" }
    - { name: FT1248MODE,   type: wire, direction: in, params: { WIDTH: 1 }, desc: "FT1248 mode select (from p1_in[7])" }

    # ADP byte streams — to/from debug subsystem
    - { name: ADP_RXD, type: axis_byte, direction: in,  params: {}, desc: "ADP receive stream (from debug_ss)" }
    - { name: ADP_TXD, type: axis_byte, direction: out, params: {}, desc: "ADP transmit stream (to debug_ss)" }

    # FT ADP byte streams — to/from FT1248 controller
    - { name: FT_ADP_RXD, type: axis_byte, direction: out, params: {}, desc: "FT1248 ADP receive stream (to ft1248_control)" }
    - { name: FT_ADP_TXD, type: axis_byte, direction: in,  params: {}, desc: "FT1248 ADP transmit stream (from ft1248_control)" }

    # USRT0 byte streams — to/from systemctrl_ss
    - { name: USRT0_TXD, type: axis_byte, direction: in,  params: {}, desc: "USRT0 transmit stream (from systemctrl_ss)" }
    - { name: USRT0_RXD, type: axis_byte, direction: out, params: {}, desc: "USRT0 receive stream (to systemctrl_ss)" }

    # USRT1 byte streams — to/from systemctrl_ss
    - { name: USRT1_TXD, type: axis_byte, direction: in,  params: {}, desc: "USRT1 transmit stream (from systemctrl_ss)" }
    - { name: USRT1_RXD, type: axis_byte, direction: out, params: {}, desc: "USRT1 receive stream (to systemctrl_ss)" }

    # EXT DAT DMA trigger outputs
    - { name: EXT_DAT_RXD_TREADY, type: wire, direction: out, params: { WIDTH: 1 }, desc: "External data RX ready (DMA trigger)" }
    - { name: EXT_DAT_TXD_TVALID, type: wire, direction: out, params: { WIDTH: 1 }, desc: "External data TX valid (DMA trigger)" }

    # FT1248 physical signals (directly wired to pads in nanosoc.sv)
    - { name: FT_CLK_O,    type: wire, direction: in,  params: { WIDTH: 1 }, desc: "FT1248 SCLK (from ft1248_control)" }
    - { name: FT_SSN_O,    type: wire, direction: in,  params: { WIDTH: 1 }, desc: "FT1248 SS_N (from ft1248_control)" }
    - { name: FT_MIOSIO_O, type: wire, direction: in,  params: { WIDTH: 1 }, desc: "FT1248 MIOSIO output (from ft1248_control)" }
    - { name: FT_MIOSIO_E, type: wire, direction: in,  params: { WIDTH: 1 }, desc: "FT1248 MIOSIO output enable (from ft1248_control)" }
    - { name: FT_MISO_I,   type: wire, direction: out, params: { WIDTH: 1 }, desc: "FT1248 MISO input (to ft1248_control)" }
    - { name: FT_MIOSIO_I, type: wire, direction: out, params: { WIDTH: 1 }, desc: "FT1248 MIOSIO input (to ft1248_control)" }

    # GPIO P1[6:0] pad interface (directly to physical pins)
    - { name: P1_IN,    type: wire, direction: in,  params: { WIDTH: 7 }, desc: "GPIO P1[6:0] pad inputs" }
    - { name: P1_OUT,   type: wire, direction: out, params: { WIDTH: 7 }, desc: "GPIO P1[6:0] pad outputs" }
    - { name: P1_OUTEN, type: wire, direction: out, params: { WIDTH: 7 }, desc: "GPIO P1[6:0] pad output enables" }

    # GPIO P1 system interface (to/from systemctrl_ss)
    - { name: SYS_P1_IN,         type: wire, direction: out, params: { WIDTH: 7 }, desc: "GPIO P1[6:0] system inputs (to systemctrl_ss)" }
    - { name: SYS_P1_OUT_MUX,    type: wire, direction: in,  params: { WIDTH: 3 }, desc: "GPIO P1[6:4] system output mux (from systemctrl_ss)" }
    - { name: SYS_P1_OUT_EN_MUX, type: wire, direction: in,  params: { WIDTH: 3 }, desc: "GPIO P1[6:4] system output enable mux (from systemctrl_ss)" }
