# Derived from RTL: nanosoc_arch_tech/rtl/src/subsystems/systemctrl/nanosoc_ss_systemctrl.v
#
# Contains nanosoc_clkctrl (PCLK/PCLKG/PRESETn generation), nanosoc_pin_mux
# (GPIO pin multiplexing), and nanosoc_region_soc_peripheral (the full
# peripheral region with APB bridge, timers, UARTs, watchdog, GPIO, sysctrl).

module:
  name: nanosoc_ss_systemctrl
  gen: False
  desc: >
    System control subsystem. Generates APB clocks (PCLK, PCLKG) and reset
    (PRESETn) from AHB domain. Contains the soc_peripheral region with all
    APB peripherals, GPIO ports, and system controller. Provides pin muxing
    for UART2 and timer external inputs.

  params:
    SYS_ADDR_W:      { type: int, default: 32, desc: "System address width" }
    SYS_DATA_W:      { type: int, default: 32, desc: "System data width" }
    APB_ADDR_W:      { type: int, default: 12, desc: "APB address width" }
    APB_DATA_W:      { type: int, default: 32, desc: "APB data width" }
    CLKGATE_PRESENT: { type: int, default: 0,  desc: "Clock gating present" }

  interfaces:
    # Clock inputs and outputs
    - { name: SYS_CLK,         type: wire, direction: in,  params: { WIDTH: 1 }, desc: "System input clock (free-running)" }
    - { name: SYS_FCLK,        type: wire, direction: out, params: { WIDTH: 1 }, desc: "Free-running clock output (directly from SYS_CLK)" }
    - { name: SYS_XTALCLK_OUT, type: wire, direction: out, params: { WIDTH: 1 }, desc: "Crystal clock output" }
    - { name: SYS_HCLK,        type: wire, direction: in,  params: { WIDTH: 1 }, desc: "AHB clock input (from cpu_ss PRMU)" }

    # Reset inputs
    - { name: SYS_SYSRESETn, type: wire, direction: in, params: { WIDTH: 1 }, desc: "External system reset (active low)" }
    - { name: SYS_PORESETn,  type: wire, direction: in, params: { WIDTH: 1 }, desc: "Power-on reset input (from cpu_ss)" }
    - { name: SYS_HRESETn,   type: wire, direction: in, params: { WIDTH: 1 }, desc: "AHB reset input (from cpu_ss)" }
    - { name: SYS_TESTMODE,  type: wire, direction: in, params: { WIDTH: 1 }, desc: "Test mode enable" }

    # Generated APB clock and reset outputs
    - { name: SYS_PCLK,    type: wire, direction: out, params: { WIDTH: 1 }, desc: "APB clock output" }
    - { name: SYS_PCLKG,   type: wire, direction: out, params: { WIDTH: 1 }, desc: "Gated APB clock output" }
    - { name: SYS_PRESETn, type: wire, direction: out, params: { WIDTH: 1 }, desc: "APB reset output (active low)" }
    - { name: SYS_PCLKEN,  type: wire, direction: out, params: { WIDTH: 1 }, desc: "APB clock enable output" }

    # AHB slave port — SoC peripheral region
    - { name: SOC_PERIPHERAL, type: ahb, direction: target, params: { ADDR_WIDTH: $SYS_ADDR_W, DATA_WIDTH: $SYS_DATA_W }, desc: "SoC peripheral AHB slave port (0x40000000-0x4FFFFFFF)" }

    # APB extension passthrough (directly wired from internal APB bridge)
    - { name: SOC_PERIPHERAL_PENABLE, type: wire, direction: out, params: { WIDTH: 1 },          desc: "APB enable passthrough for external APB slaves" }
    - { name: SOC_PERIPHERAL_PWRITE,  type: wire, direction: out, params: { WIDTH: 1 },          desc: "APB write passthrough" }
    - { name: SOC_PERIPHERAL_PADDR,   type: wire, direction: out, params: { WIDTH: $APB_ADDR_W }, desc: "APB address passthrough" }
    - { name: SOC_PERIPHERAL_PWDATA,  type: wire, direction: out, params: { WIDTH: $APB_DATA_W }, desc: "APB write data passthrough" }

    # APB extension slot 14 — USRT (connected to debug subsystem)
    - { name: USRT_PSEL,    type: wire, direction: out, params: { WIDTH: 1 },          desc: "APB select for USRT extension port 14" }
    - { name: USRT_PRDATA,  type: wire, direction: in,  params: { WIDTH: $APB_DATA_W }, desc: "APB read data from USRT" }
    - { name: USRT_PREADY,  type: wire, direction: in,  params: { WIDTH: 1 },          desc: "APB ready from USRT" }
    - { name: USRT_PSLVERR, type: wire, direction: in,  params: { WIDTH: 1 },          desc: "APB slave error from USRT" }

    # Interrupt outputs
    - { name: SYS_NMI,       type: wire, direction: out, params: { WIDTH: 1 },  desc: "Non-maskable interrupt (from watchdog)" }
    - { name: SYS_APB_IRQ,   type: wire, direction: out, params: { WIDTH: 32 }, desc: "APB subsystem interrupt vector" }
    - { name: SYS_GPIO0_IRQ, type: wire, direction: out, params: { WIDTH: 16 }, desc: "GPIO port 0 individual interrupts" }
    - { name: SYS_GPIO1_IRQ, type: wire, direction: out, params: { WIDTH: 16 }, desc: "GPIO port 1 individual interrupts" }

    # System control outputs
    - { name: SYS_REMAP_CTRL,    type: wire, direction: out, params: { WIDTH: 1 }, desc: "Memory remap control bit (inverted before use in nanosoc.sv)" }
    - { name: SYS_WDOGRESETREQ,  type: wire, direction: out, params: { WIDTH: 1 }, desc: "Watchdog reset request" }
    - { name: SYS_LOCKUPRESET,   type: wire, direction: out, params: { WIDTH: 1 }, desc: "Reset on CPU lockup config" }
    - { name: SYS_PMUENABLE,     type: wire, direction: out, params: { WIDTH: 1 }, desc: "Power management unit enable" }

    # CPU status/control inputs
    - { name: CPU_SYSRESETREQ,    type: wire, direction: in, params: { WIDTH: 1 }, desc: "CPU system reset request" }
    - { name: CPU_PRMURESETREQ,   type: wire, direction: in, params: { WIDTH: 1 }, desc: "CPU PRMU reset request" }
    - { name: SYS_PMUDBGRESETREQ, type: wire, direction: in, params: { WIDTH: 1 }, desc: "PMU debug reset request" }
    - { name: CPU_LOCKUP,         type: wire, direction: in, params: { WIDTH: 1 }, desc: "CPU lockup status" }
    - { name: CPU_SLEEPING,       type: wire, direction: in, params: { WIDTH: 1 }, desc: "CPU sleeping status" }
    - { name: CPU_SLEEPDEEP,      type: wire, direction: in, params: { WIDTH: 1 }, desc: "CPU deep sleep status" }

    # USRT byte streams (to/from extio_ss)
    - { name: USRT0_TXD, type: axis_byte, direction: out, params: {}, desc: "USRT0 transmit byte stream" }
    - { name: USRT0_RXD, type: axis_byte, direction: in,  params: {}, desc: "USRT0 receive byte stream" }
    - { name: USRT1_TXD, type: axis_byte, direction: out, params: {}, desc: "USRT1 transmit byte stream" }
    - { name: USRT1_RXD, type: axis_byte, direction: in,  params: {}, desc: "USRT1 receive byte stream" }

    # GPIO ports
    - { name: P0, type: gpio, direction: inout, params: { WIDTH: 16 }, desc: "GPIO port 0 (16 pins)" }
    - { name: P1, type: gpio, direction: inout, params: { WIDTH: 16 }, desc: "GPIO port 1 (16 pins, with FTDI/EXTIO pin muxing)" }
    - { name: P1_OUT_MUX,    type: wire, direction: out, params: { WIDTH: 16 }, desc: "GPIO port 1 output after pin mux" }
    - { name: P1_OUT_EN_MUX, type: wire, direction: out, params: { WIDTH: 16 }, desc: "GPIO port 1 output enable after pin mux" }

  # Internal instances
  instances:
    - instance_name: u_clkctrl
      module: nanosoc_clkctrl
      addressable: False
      params: {}
      connections: []

    - instance_name: u_pin_mux
      module: nanosoc_pin_mux
      addressable: False
      params: {}
      connections: []

    - instance_name: u_region_soc_peripheral
      module: nanosoc_region_soc_peripheral
      addressable: True
      params: { SYS_ADDR_W: $SYS_ADDR_W, SYS_DATA_W: $SYS_DATA_W, APB_ADDR_W: $APB_ADDR_W, APB_DATA_W: $APB_DATA_W }
      connections:
        - { port: ahb_slave, conn: SOC_PERIPHERAL }
